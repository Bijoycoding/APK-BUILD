<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Password Protect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --outer:#020a08;--bg:#07130f;--bg2:#0a1a15;--card:#0e231d;--card2:#12302a;--line:#1b3b33;
  --text:#e8f6f1;--muted:#8db3a7;--accent:#2fe0a3;--accent-ink:#03211a;--tile:#123a30;
  --glow:rgba(47,224,163,.16);--glow2:rgba(47,224,163,.38);--danger:#ff7676;--star:#f6be4a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --outer:#dfece7;--bg:#f2f8f5;--bg2:#ffffff;--card:#ffffff;--card2:#e8f3ee;--line:#cfe3da;
  --text:#0c2a21;--muted:#56786c;--accent:#0c9f73;--accent-ink:#ffffff;--tile:#dff3ea;
  --glow:rgba(12,159,115,.14);--glow2:rgba(12,159,115,.32);--danger:#d64545;--star:#e0a010;
}
:root[data-theme="amoled"]{
  --outer:#000;--bg:#000;--bg2:#040a08;--card:#09130f;--card2:#0f1f19;--line:#14281f;
  --tile:#0d2c23;--glow:rgba(47,224,163,.12);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--outer);color:var(--text);font-family:"Plus Jakarta Sans","Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.frame{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(120% 55% at 0% 0%,var(--glow),transparent 60%),var(--bg)}
@media (min-width:600px){
  body{align-items:center;padding:24px}
  .frame{height:min(100%,880px);border-radius:36px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.45)}
}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}

/* type + layout */
.top{display:flex;align-items:center;gap:12px;padding:14px 18px 8px}
.ttl{font-weight:700;font-size:19px;letter-spacing:-.01em}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.iconbtn{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:transparent;border:0;color:var(--text)}
.iconbtn:active{background:var(--card2)}
.logo-sm{width:38px;height:38px;border-radius:12px;background:var(--tile);color:var(--accent);display:grid;place-items:center}
.search{display:flex;align-items:center;gap:10px;margin:6px 18px 14px;padding:0 14px;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;height:100%}
.search input::placeholder{color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:8px;padding:0 18px 14px}
.chip{padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sect{margin:8px 18px 10px;font-weight:700;font-size:15px;color:var(--accent)}
.pad-b{height:104px;flex:none}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:12px;margin:0 18px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.row .iconbtn{width:34px;height:34px;color:var(--muted)}
.tile{width:42px;height:42px;border-radius:12px;background:var(--tile);color:var(--accent);display:grid;place-items:center;flex:none}
.name{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.star.on{color:var(--star)}
.star.on svg{fill:var(--star)}
.empty{margin:28px 24px;padding:26px 20px;border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--text);font-size:16px}
.empty .tile{width:54px;height:54px;border-radius:16px}

/* home */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 14px}
.stat{border-radius:16px;padding:14px;background:var(--card);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end}
.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.stat strong{font-size:30px;line-height:1;font-weight:800}
.stat .tile{width:38px;height:38px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 18px 12px}
.qtile{border-radius:16px;padding:14px 8px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:12.5px;color:var(--text)}
.qtile .tile{width:40px;height:40px}

/* fab + nav + toast */
.fab{position:absolute;right:18px;bottom:88px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;box-shadow:0 10px 26px var(--glow2);z-index:20}
.nav{display:flex;border-top:1px solid var(--line);background:var(--bg2);padding:8px 4px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:0;color:var(--muted);font-size:11px;font-weight:600;padding:4px 0}
.nav button.on{color:var(--accent)}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:999px;font-weight:650;font-size:13px;transition:opacity .2s,transform .2s;z-index:60;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* buttons + fields */
.btn{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn:disabled{opacity:.6}
.fg{margin:0 18px 14px}
.fg>label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.fg>label i{font-style:normal;color:var(--muted);font-weight:500}
.field{display:flex;align-items:center;gap:8px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:0 12px;min-height:46px}
.field:focus-within{border-color:var(--accent)}
.field input,.field textarea,.field select{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:12px 0;resize:none}
.field select{appearance:none;-webkit-appearance:none;cursor:pointer}
.field select option{background:var(--card);color:var(--text)}
.field .iconbtn{width:30px;height:30px;color:var(--muted)}
.formact{display:flex;gap:12px;padding:6px 18px 0}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:0 18px 8px;text-align:center}
.tabs3{display:flex;gap:8px;margin:6px 18px 16px;padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.tabs3 button{flex:1;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:650;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs3 button.on{background:var(--accent);color:var(--accent-ink)}

/* detail */
.card{margin:0 18px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.drow{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.lbl{font-size:12px;color:var(--muted);margin-bottom:3px}
.val{font-size:15px;word-break:break-word}
.val.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em}
.val.pre{white-space:pre-wrap}
.meta{margin:0 18px 14px;font-size:12px;color:var(--muted);line-height:1.7}
.detact{display:flex;gap:10px;padding:0 18px}
.detact .btn{height:44px;font-size:13.5px}

/* settings */
.srow{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);cursor:pointer}
.srow:last-child{border-bottom:0}
.sic{color:var(--muted);display:grid;place-items:center;width:22px}
.tag{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.tog{width:46px;height:26px;flex:none;border-radius:999px;background:var(--line);border:0;position:relative;transition:background .18s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s}
.tog.on{background:var(--accent)}
.tog.on::after{transform:translateX(20px)}
.tog:disabled{opacity:.45}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 11px;border-radius:9px;font-weight:650;font-size:12.5px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);position:relative}
.radio.on{border-color:var(--accent)}
.radio.on::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.thumb{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--tile);color:var(--accent);display:grid;place-items:center;border:2px solid var(--accent);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.linkbtn{background:transparent;border:0;color:var(--accent);font-weight:650;font-size:13px;padding:6px}

/* generator */
.genout{margin:6px 18px 14px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:10px}
.genout code{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;word-break:break-all;letter-spacing:.03em}
.meter{display:flex;gap:6px;margin:0 18px 6px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--accent)}
input[type=range]{accent-color:var(--accent);width:100%}

/* lock / splash */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 26px;gap:12px}
.center h1{margin:6px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.center p{margin:0}
.accent{color:var(--accent);font-weight:600}
.logo{position:relative;width:112px;height:112px;border-radius:32px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);box-shadow:0 0 60px var(--glow2)}
.logo .inlock{position:absolute;inset:0;display:grid;place-items:center;padding-top:4px}
.chipcol{display:flex;flex-direction:column;gap:10px;width:200px;margin-top:14px}
.chipcol span{display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.chipcol span i{width:30px;height:30px;border-radius:50%;background:var(--tile);color:var(--accent);display:grid;place-items:center}
.fp{width:104px;height:104px;border-radius:50%;border:1.5px solid var(--accent);background:var(--card);color:var(--accent);display:grid;place-items:center;box-shadow:0 0 40px var(--glow2);margin:10px 0}
.center .field{width:100%;text-align:left}
.center .btn{margin-top:4px}
.center .err{margin:0;min-height:18px}

/* backup */
.note-t{margin:0 18px 12px;color:var(--muted);font-size:13.5px;line-height:1.55}
.ta{width:calc(100% - 36px);margin:0 18px 12px;min-height:110px;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);outline:0;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.ta:focus{border-color:var(--accent)}

/* floating bubble */
#overlay{position:absolute;inset:0;pointer-events:none;z-index:40}
.bubble{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid var(--accent);background:linear-gradient(160deg,var(--card2),var(--card));color:var(--accent);display:grid;place-items:center;overflow:hidden;touch-action:none;padding:0;box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 0 6px var(--glow);cursor:grab}
.bubble.small{width:44px;height:44px}.bubble.medium{width:56px;height:56px}.bubble.large{width:68px;height:68px}
.bubble.left{left:10px}.bubble.right{right:10px}
.bubble img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.bubble.pop{animation:pop .22s cubic-bezier(.3,1.6,.5,1)}
.bubble.dragging{cursor:grabbing;transform:scale(1.08)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.bmenu{position:absolute;left:12px;right:12px;pointer-events:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);max-height:calc(100% - 24px);display:flex;flex-direction:column;gap:10px}
.bm-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.bm-head .logo-sm{width:28px;height:28px;border-radius:9px}
.bmenu .search{margin:0;height:40px}
.bm-list{overflow-y:auto;max-height:230px;display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.mrow .tile{width:34px;height:34px;border-radius:10px}
.mrow .iconbtn{width:32px;height:32px;color:var(--muted)}
.mrow .ins{font-size:12px;font-weight:700;color:var(--accent);background:transparent;border:1px solid var(--accent);border-radius:8px;padding:5px 8px}
.bmenu .btn{height:42px;font-size:13.5px}
.bmenu .seg{width:100%}.bmenu .seg button{flex:1}
.bmenu .field{min-height:42px}
.bmenu .field input,.bmenu .field select{padding:9px 0;font-size:14px}
.demo-in{margin:6px 18px 14px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.demo-in textarea{flex:1;background:transparent;border:0;outline:0;resize:none;min-height:96px}
.demo-in:focus-within{border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="screen" id="screen"></div>
  <button class="fab" id="fab" data-act="fab" aria-label="Add entry" hidden></button>
  <nav class="nav" id="nav" hidden></nav>
  <div id="overlay">
    <button class="bubble medium right" id="bubble" hidden aria-label="Open vault menu"></button>
    <div class="bmenu" id="bmenu" hidden></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(()=>{
'use strict';
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36));

/* ---------- icons ---------- */
const I={
shield:'<path d="M12 2l8 3v6c0 5-3.5 9.3-8 11-4.5-1.7-8-6-8-11V5l8-3z"/>',
lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
code:'<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>',
file:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',
eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
eyeoff:'<path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4M6.5 6.6A16.6 16.6 0 002 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1M9.9 9.9a3 3 0 004.2 4.2"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
back:'<path d="M15 5l-7 7 7 7"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
check:'<path d="M5 12l5 5 9-10"/>',
refresh:'<path d="M20 11a8 8 0 00-14-4L4 9M4 4v5h5M4 13a8 8 0 0014 4l2-2M20 20v-5h-5"/>',
fingerprint:'<path d="M12 10a2 2 0 00-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0118-6"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 01.34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 019 5.2v2"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',
mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
download:'<path d="M12 4v11M7 11l5 5 5-5M4 20h16"/>',
upload:'<path d="M12 16V5M7 9l5-5 5 5M4 20h16"/>',
image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
chev:'<path d="M9 5l7 7-7 7"/>',
bubble:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
sliders:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>'
};
const ico=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

/* ---------- storage (falls back to memory if the browser blocks it) ---------- */
const mem={};let volatile=false;
const store={
  get(k){if(k in mem)return mem[k];try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){volatile=true}},
  del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}
};

/* ---------- crypto: PBKDF2 -> AES-GCM ---------- */
const te=new TextEncoder(),td=new TextDecoder();
const toB64=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,salt){
  const km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encJ(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj)));
  return {iv:toB64(iv),ct:toB64(ct)};
}
async function decJ(key,p){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(p.iv)},key,fromB64(p.ct));
  return JSON.parse(td.decode(pt));
}

async function copyText(t,label){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}catch(e){
    try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e2){}
  }
  toast(ok?(label||'Copied')+' · clears in 30s':'Copy failed on this browser');
  clearTimeout(S.clip);S.clip=setTimeout(()=>{try{navigator.clipboard.writeText('')}catch(e){}},30000);
  return ok;
}

/* ---------- generator ---------- */
const G={len:18,u:true,l:true,n:true,s:true,out:''};
function genPass(len,o){
  const sets={u:'ABCDEFGHJKLMNPQRSTUVWXYZ',l:'abcdefghijkmnopqrstuvwxyz',n:'23456789',s:'!@#$%^&*-_=+?'};
  let pool='',req=[];
  for(const k in sets)if(o[k]){pool+=sets[k];req.push(sets[k])}
  if(!pool){pool=sets.l;req=[sets.l]}
  const rnd=n=>{const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n};
  const out=req.map(s=>s[rnd(s.length)]);
  while(out.length<len)out.push(pool[rnd(pool.length)]);
  for(let i=out.length-1;i>0;i--){const j=rnd(i+1);[out[i],out[j]]=[out[j],out[i]]}
  return out.join('');
}
function strength(len,o){
  let p=0;if(o.u)p+=24;if(o.l)p+=24;if(o.n)p+=8;if(o.s)p+=13;if(!p)p=24;
  const bits=len*Math.log2(p);
  return bits<45?[1,'Weak']:bits<70?[2,'Fair']:bits<100?[3,'Strong']:[4,'Excellent'];
}
const newGen=()=>{G.out=genPass(G.len,G)};

  <p class="note-t">${S.settings.bubble?'In the Android app the bubble follows the keyboard in every app. Here it works inside this page so you can try the feel.':'The bubble is turned off. Enable it in Settings → Floating Bubble.'}</p>`}

const VIEWS={splash:vSplash,setup:vLock,lock:vLock,home:vHome,list:vList,detail:vDetail,edit:vEdit,settings:vSettings,gen:vGen,backup:vBackup,chpass:vChpass,demo:vDemo};
const NAV=[['home','Home','home'],['pw','Passwords','lock'],['api','API Keys','code'],['note','Notes','file'],['settings','Settings','gear']];

function navActive(){const r=S.route;if(r.name==='home')return'home';if(r.name==='list')return r.type==='password'?'pw':r.type;if(r.name==='settings')return'settings';return''}
function render(){
  if(!['splash','setup','lock'].includes(S.route.name)&&!S.key)S.route={name:store.get('pp.meta')?'lock':'setup'};
  const r=S.route.name;
  $('#screen').innerHTML=VIEWS[r]();
  const showNav=['home','list','settings'].includes(r);
  const nav=$('#nav');nav.hidden=!showNav;
  if(showNav){const a=navActive();nav.innerHTML=NAV.map(n=>`<button class="${a===n[0]?'on':''}" data-act="nav" data-to="${n[0]}">${ico(n[2],22)}${n[1]}</button>`).join('')}
  const fab=$('#fab');fab.hidden=!(r==='home'||r==='list');fab.innerHTML=ico('plus',26);
  syncBubble();
  if(r==='lock'||r==='setup')setTimeout(()=>{const p=$('#pw1');p&&p.focus()},50);
}
function go(name,p={}){
  const prev=S.route.name;
  S.route=Object.assign({name},p);S.reveal={};S.demoFocus=false;S.bmenu=false;S.bsave=false;
  if(name==='list'&&prev!=='list'){S.q='';S.chip='all'}
  render();$('#screen').scrollTop=0;
}
S.stackBack=null;
function refresh(){
  const r=S.route.name;
  if(r==='home'){$('#homeBody').innerHTML=homeBody();$('.stats').outerHTML=$('.stats').outerHTML}
  else if(r==='list')$('#listBody').innerHTML=listBody();
  else render();
}

/* ---------- auth ---------- */
const lockErr=m=>{const el=$('#lockErr');if(el)el.textContent=m};
async function doSetup(){
  const a=$('#pw1').value,b=$('#pw2').value;
  if(a.length<8)return lockErr('Use at least 8 characters.');
  if(a!==b)return lockErr('The two passwords do not match.');
  if(!(window.crypto&&crypto.subtle))return lockErr('This browser cannot encrypt. Open the page over HTTPS.');
  const btn=$('#lockBtn');btn.disabled=true;btn.textContent='Creating…';
  const salt=crypto.getRandomValues(new Uint8Array(16)),key=await derive(a,salt);
  store.set('pp.meta',{v:1,salt:toB64(salt),check:await encJ(key,'ok')});
  S.key=key;S.data={entries:[]};await save();S.last=Date.now();
  go('home');if(volatile)toast('Browser storage is blocked, so data will not persist');
}
async function doUnlock(){
  const pw=$('#pw1').value,meta=store.get('pp.meta');if(!pw)return lockErr('Enter your master password.');
  const btn=$('#lockBtn');btn.disabled=true;btn.textContent='Unlocking…';
  try{
    const key=await derive(pw,fromB64(meta.salt));
    if(await decJ(key,meta.check)!=='ok')throw 0;
    const d=store.get('pp.data');S.data=d?await decJ(key,d):{entries:[]};if(!S.data.entries)S.data.entries=[];
    S.key=key;S.last=Date.now();go('home');
  }catch(e){btn.disabled=false;btn.textContent='Enter Password';lockErr('Wrong master password. Try again.')}
}
function lock(){S.key=null;S.data={entries:[]};S.bmenu=false;S.demoFocus=false;go('lock')}
setInterval(()=>{if(S.key&&S.settings.autoLock>0&&Date.now()-S.last>S.settings.autoLock*60000){lock();toast('Vault locked after inactivity')}},5000);
['pointerdown','keydown','scroll'].forEach(ev=>addEventListener(ev,()=>{S.last=Date.now()},true));

/* ---------- entries ---------- */
const FIELDS={name:'f-name',username:'f-user',secret:'f-secret',website:'f-web',category:'f-cat',note:'f-note',service:'f-service'};
function readForm(){const o={};for(const k in FIELDS){const el=$('#'+FIELDS[k]);if(el)o[k]=el.value}return o}
async function saveEntry(){
  const r=S.route,t=r.type,f=Object.assign({},S.draft||{},readForm()),err=m=>{$('#formErr').textContent=m};
  if(!(f.name||'').trim())return err('Give it a name.');
  if(!(f.secret||'').trim())return err(t==='password'?'Enter the password.':t==='api'?'Paste the API key.':'Write something in the note.');
  const data={name:f.name.trim(),secret:f.secret};
  if(t==='password')Object.assign(data,{username:f.username||'',website:f.website||'',category:f.category||'Personal',note:f.note||''});
  if(t==='api')Object.assign(data,{service:f.service||'',category:f.category||'Personal',note:f.note||''});
  const now=Date.now();let e;
  if(r.id){e=byId(r.id);Object.assign(e,data,{updated:now})}
  else{e=Object.assign({id:uid(),type:t,fav:false,created:now,updated:now,used:0},data);S.data.entries.unshift(e)}
  await save();S.draft=null;toast('Saved');go('detail',{id:e.id});
}
function sample(){
  const n=Date.now(),h=36e5,d=864e5;
  const base=[
   {type:'password',name:'Email Account',username:'user@example.com',secret:'Demo-Email#2291',website:'https://example.com',category:'Email',note:'Personal email account',fav:true},
   {type:'password',name:'Social Media',username:'social@domain.com',secret:'Demo-Social!77',category:'Social'},
   {type:'password',name:'Bank Account',username:'user@bank.com',secret:'Demo-Bank@5530',category:'Finance',fav:true},
   {type:'password',name:'Work Portal',username:'user@company.com',secret:'Demo-Work$8841',category:'Work'},
   {type:'api',name:'OpenAI API',service:'OpenAI',secret:'sk-demo-1234567890abcdef',fav:true},
   {type:'api',name:'Firebase',service:'Google',secret:'AIza-demo-abcdef123456'},
   {type:'note',name:'Server Details',secret:'Database credentials\nhost: db.internal\nport: 5432',fav:true}];
  return base.map((e,i)=>Object.assign({id:uid(),fav:false,category:'Personal',website:'',username:'',service:'',note:'',created:n-(i+2)*d,updated:n-(i+1)*d,used:n-(i+1)*h*2},e));
}

/* ---------- floating bubble ---------- */
const frame=$('#frame'),bubble=$('#bubble'),bmenu=$('#bmenu');
function applyBubble(){
  const s=S.settings;
  bubble.className='bubble '+s.bubbleSize+' '+s.bubbleSide;
  bubble.style.top=s.bubbleY+'px';bubble.style.left='';bubble.style.right='';
  bubble.innerHTML=s.bubbleImg?`<img src="${s.bubbleImg}" alt="">`:ico('shield',24);
}
function syncBubble(){
  const show=!!(S.settings.bubble&&S.key&&(S.demoFocus||S.bmenu));
  const was=!bubble.hidden;
  bubble.hidden=!show;
  if(show){applyBubble();if(!was){bubble.classList.remove('pop');void bubble.offsetWidth;bubble.classList.add('pop')}}
  else{S.bmenu=false}
  renderBMenu();
}
function bmRow(e){
  const demo=S.route.name==='demo';
  return `<div class="mrow"><div class="tile">${ico(entryIcon(e),17)}</div><div class="grow"><div class="name" style="font-size:14px">${esc(e.name)}</div><div class="sub">${esc(subText(e))}</div></div>
  ${demo?`<button class="ins" data-act="binsert" data-id="${e.id}">Insert</button>`:''}
  <button class="iconbtn" data-act="bcopy" data-id="${e.id}" aria-label="Copy ${esc(e.name)}">${ico('copy',17)}</button></div>`}
function bmList(){
  const q=(S.bq||'').trim(),r=ofType(S.btab).filter(e=>matches(e,q)).sort(recentSort);
  return r.length?r.map(bmRow).join(''):`<div class="sub" style="padding:14px;text-align:center">${q?'No matches.':'Nothing saved here yet.'}</div>`}
function renderBMenu(){
  if(!S.bmenu||bubble.hidden){bmenu.hidden=true;return}
  bmenu.hidden=false;
  const head=`<div class="bm-head"><div class="logo-sm">${ico('shield',16)}</div><span class="grow">Password Protect</span>
    <button class="iconbtn" style="width:30px;height:30px" data-act="bsave" aria-label="Save new">${ico('plus',18)}</button>
    <button class="iconbtn" style="width:30px;height:30px" data-act="bclose" aria-label="Close">${ico('x',18)}</button></div>`;
  let inner;
  if(S.bsave){
    inner=`<div class="seg"><button class="${S.btab==='password'?'on':''}" data-act="btab" data-val="password">Password</button><button class="${S.btab==='api'?'on':''}" data-act="btab" data-val="api">API Key</button></div>
    <div class="field"><input id="bs-name" placeholder="Name" autocomplete="off"></div>
    <div class="field"><input id="bs-secret" type="password" placeholder="${S.btab==='api'?'API key':'Password'}" autocomplete="off"></div>
    <button class="btn primary" data-act="bsavego">Save</button>`;
  }else{
    inner=`<label class="search">${ico('search',16)}<input id="bq" placeholder="Search…" value="${esc(S.bq)}" autocomplete="off"></label>
    <div class="seg"><button class="${S.btab==='password'?'on':''}" data-act="btab" data-val="password">${ico('lock',14)} Passwords</button><button class="${S.btab==='api'?'on':''}" data-act="btab" data-val="api">${ico('code',14)} API Keys</button></div>
    <div class="bm-list" id="bmList">${bmList()}</div>
    <button class="btn ghost" data-act="bopen">Open Full Vault</button>`;
  }
  bmenu.innerHTML=head+inner;
  const fr=frame.getBoundingClientRect(),b=bubble.getBoundingClientRect(),mh=bmenu.offsetHeight;
  let t=b.bottom-fr.top+8;if(t+mh>fr.height-12)t=Math.max(12,b.top-fr.top-mh-8);
  bmenu.style.top=t+'px';
}
let drag=null;
['mousedown','touchstart'].forEach(ev=>bubble.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
bmenu.addEventListener('mousedown',e=>{if(!e.target.closest('input,textarea,select'))e.preventDefault()});
bubble.addEventListener('pointerdown',e=>{
  e.preventDefault();bubble.setPointerCapture(e.pointerId);
  drag={x:e.clientX,y:e.clientY,moved:false,fr:frame.getBoundingClientRect(),br:bubble.getBoundingClientRect()};
});
bubble.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>7)drag.moved=true;if(!drag.moved)return;
  bubble.classList.add('dragging');
  bubble.style.left=(drag.br.left-drag.fr.left+dx)+'px';bubble.style.right='auto';bubble.style.top=(drag.br.top-drag.fr.top+dy)+'px';
});
bubble.addEventListener('pointerup',e=>{
  if(!drag)return;const d=drag;drag=null;bubble.classList.remove('dragging');
  if(!d.moved){S.bmenu=!S.bmenu;S.bsave=false;S.bq='';renderBMenu();return}
  const b=bubble.getBoundingClientRect(),fr=d.fr;
  S.settings.bubbleSide=(b.left+b.width/2-fr.left)<fr.width/2?'left':'right';
  S.settings.bubbleY=Math.round(Math.min(Math.max(b.top-fr.top,60),fr.height-b.height-90));
  saveSettings();applyBubble();renderBMenu();if(S.route.name==='settings')render();
});
bubble.addEventListener('pointercancel',()=>{drag=null;bubble.classList.remove('dragging');applyBubble()});
document.addEventListener('focusin',e=>{if(e.target.id==='demoInput'){S.demoFocus=true;syncBubble()}});
document.addEventListener('focusout',e=>{if(e.target.id==='demoInput')setTimeout(()=>{S.demoFocus=document.activeElement&&document.activeElement.id==='demoInput';syncBubble()},150)});

/* ---------- helpers ---------- */
function armed(btn,txt){
  if(btn.dataset.armed)return true;
  btn.dataset.armed='1';const old=btn.innerHTML;btn.innerHTML=`<span>${txt}</span>`;
  setTimeout(()=>{if(btn.isConnected){btn.innerHTML=old;delete btn.dataset.armed}},3500);return false;
}
function setTheme(t){S.settings.theme=t;document.documentElement.setAttribute('data-theme',t);saveSettings()}
function downscale(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const s=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85))};
  img.onerror=rej;img.src=u})}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,d=el.dataset;
  switch(a){
    case 'skipsplash':clearTimeout(S.splashT);go(store.get('pp.meta')?'lock':'setup');break;
    case 'fp':toast('Fingerprint unlock is in the Android app. Enter your master password here.');{const p=$('#pw1');p&&p.focus()}break;
    case 'setup':doSetup();break;
    case 'unlock':doUnlock();break;
    case 'go':go(d.to,d.type?{type:d.type}:{});break;
    case 'nav':d.to==='home'?go('home'):d.to==='settings'?go('settings'):go('list',{type:d.to==='pw'?'password':d.to});break;
    case 'list':go('list',{type:d.type});break;
    case 'back':go('list',{type:(byId(S.route.id)||{type:'password'}).type});break;
    case 'open':go('detail',{id});break;
    case 'fab':S.draft=null;go('edit',{type:S.route.name==='list'?S.route.type:'password'});break;
    case 'fav':{const e=byId(id);e.fav=!e.fav;await save();refresh();break}
    case 'copy':{const e=byId(id);if(await copyText(e.secret,e.type==='note'?'Note copied':e.type==='api'?'API key copied':'Password copied'))touch(e);break}
    case 'copyf':{const e=byId(id);if(await copyText(e[d.field],'Copied'))touch(e);break}
    case 'reveal':S.reveal[d.key]=!S.reveal[d.key];{const st=$('#screen').scrollTop;render();$('#screen').scrollTop=st}break;
    case 'edit':S.draft=null;go('edit',{id,type:byId(id).type});break;
    case 'del':if(armed(el,'Tap again to delete')){const t=byId(id).type;S.data.entries=S.data.entries.filter(e=>e.id!==id);await save();toast('Deleted');go('list',{type:t})}break;
    case 'tab':S.draft=Object.assign(S.draft||{},readForm());go('edit',{type:d.type});break;
    case 'formeye':{const i=$('#f-secret');i.type=i.type==='password'?'text':'password';break}
    case 'genfill':{const i=$('#f-secret');i.value=genPass(18,{u:1,l:1,n:1,s:1});i.type='text';break}
    case 'saveentry':saveEntry();break;
    case 'cancel':{const r=S.route;S.draft=null;r.id?go('detail',{id:r.id}):go('list',{type:r.type})}break;
    case 'chip':S.chip=d.val;$('#screen').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.val===d.val));$('#listBody').innerHTML=listBody();break;
    case 'sample':S.data.entries.push(...sample());await save();render();break;
    case 'tog':{
      const k=d.key;
      if(k==='bubble'){S.settings.bubble=!S.settings.bubble;saveSettings();render()}
      else if(k[0]==='g'&&k.length===2){G[k[1]]=!G[k[1]];newGen();render()}
      break}
    case 'set':{const v=d.val;S.settings[d.key]=/^\d+$/.test(v)?Number(v):v;saveSettings();applyBubble();render();break}
    case 'theme':setTheme(d.val);render();break;
    case 'rmimg':S.settings.bubbleImg=null;saveSettings();render();break;
    case 'lock':lock();break;
    case 'autofill':toast('Autofill runs inside the Android app, not in a browser.');break;
    case 'erase':if(armed(el,'Tap again to erase everything')){['pp.meta','pp.data'].forEach(store.del);S.key=null;S.data={entries:[]};toast('Vault erased');go('setup')}break;
    case 'regen':newGen();render();break;
    case 'gcopy':copyText(G.out,'Password copied');break;
    case 'bkmake':await save();S.backupText=JSON.stringify({app:'password-protect',v:1,meta:store.get('pp.meta'),data:store.get('pp.data')});render();break;
    case 'bkcopy':copyText(S.backupText,'Backup code copied');break;
    case 'bkrestore':{
      if(!armed(el,'Tap again to replace vault'))break;
      try{const o=JSON.parse($('#bkIn').value.trim());
        if(!(o&&o.meta&&o.meta.salt&&o.meta.check&&o.meta.check.ct))throw 0;
        store.set('pp.meta',o.meta);o.data?store.set('pp.data',o.data):store.del('pp.data');
        S.key=null;S.data={entries:[]};toast('Restored. Unlock with the backup’s master password.');go('lock');
      }catch(e){toast('That backup code is not valid')}
      break}
    case 'chsave':{
      const err=m=>{$('#formErr').textContent=m},o=$('#cp0').value,n=$('#cp1').value,c=$('#cp2').value,meta=store.get('pp.meta');
      if(n.length<8)return err('New password needs at least 8 characters.');
      if(n!==c)return err('The new passwords do not match.');
      try{const k0=await derive(o,fromB64(meta.salt));if(await decJ(k0,meta.check)!=='ok')throw 0}catch(e){return err('Current password is wrong.')}
      const salt=crypto.getRandomValues(new Uint8Array(16)),key=await derive(n,salt);
      store.set('pp.meta',{v:1,salt:toB64(salt),check:await encJ(key,'ok')});S.key=key;await save();toast('Master password changed');go('settings');break}
    /* bubble menu */
    case 'bclose':S.bmenu=false;S.bsave=false;syncBubble();break;
    case 'bopen':S.bmenu=false;go('home');break;
    case 'btab':S.btab=d.val;renderBMenu();break;
    case 'bsave':S.bsave=!S.bsave;renderBMenu();break;
    case 'bsavego':{
      const n=$('#bs-name').value.trim(),s=$('#bs-secret').value;if(!n||!s)return toast('Add a name and a value');
      const now=Date.now();S.data.entries.unshift({id:uid(),type:S.btab,name:n,secret:s,username:'',website:'',service:'',category:'Personal',note:'',fav:false,created:now,updated:now,used:0});
      await save();S.bsave=false;renderBMenu();toast('Saved to vault');break}
    case 'bcopy':{const e=byId(id);if(await copyText(e.secret,'Copied'))touch(e);break}
    case 'binsert':{const e=byId(id),t=$('#demoInput');if(t){t.value+=e.secret;t.focus();touch(e);toast('Inserted')}break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.route.name==='home'?($('#homeBody').innerHTML=homeBody()):S.route.name==='list'&&($('#listBody').innerHTML=listBody())}
  else if(t.id==='bq'){S.bq=t.value;$('#bmList').innerHTML=bmList()}
  else if(t.id==='glen'){G.len=+t.value;$('#glenv').textContent=G.len;newGen();$('#genOut').textContent=G.out;const [lv,lab]=strength(G.len,G);$('.meter').innerHTML=[1,2,3,4].map(i=>`<i class="${i<=lv?'on':''}"></i>`).join('');$('.meta').textContent='Strength: '+lab}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='imgIn'&&e.target.files[0]){
    try{S.settings.bubbleImg=await downscale(e.target.files[0]);saveSettings();render();toast('Bubble image updated')}catch(x){toast('Could not read that image')}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.target.id==='pw1'||e.target.id==='pw2')){const b=$('#lockBtn');b&&!b.disabled&&b.click()}
});

/* ---------- boot ---------- */
document.documentElement.setAttribute('data-theme',S.settings.theme);
applyBubble();render();
S.splashT=setTimeout(()=>{if(S.route.name==='splash')go(store.get('pp.meta')?'lock':'setup')},1700);
})();
</script>
