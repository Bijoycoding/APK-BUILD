<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bcodgame</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0a0b0f;color:#e6edf3;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-feature-settings:'ss01','cv01','tnum'}
  canvas{display:block;width:100%;height:100%}

  .hud{position:fixed;top:0;left:0;right:0;z-index:5;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:calc(env(safe-area-inset-top,0px) + 40px) 32px 0;
    pointer-events:none}
  .hud-left{text-align:left}
  .hud-right{text-align:right}
  .label{font-size:9px;letter-spacing:.26em;text-transform:uppercase;
    color:#3f4854;font-weight:500;margin-bottom:9px;line-height:1}
  .value{font-size:24px;font-weight:400;letter-spacing:-.03em;
    color:#e6edf3;font-variant-numeric:tabular-nums;line-height:1;
    transition:transform .18s ease}
  .value.pop{transform:scale(1.05)}

  .lives{display:flex;gap:6px;align-items:center;margin-top:14px;height:6px}
  .life{width:5px;height:5px;border-radius:50%;background:#7dd3c0;
    box-shadow:0 0 10px rgba(125,211,192,.55);
    transition:all .5s cubic-bezier(.4,0,.2,1)}
  .life.dead{background:transparent;box-shadow:inset 0 0 0 1px #1f242e;
    transform:scale(.7)}

  .effects{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);
    left:50%;transform:translateX(-50%);z-index:6;
    display:flex;gap:14px;pointer-events:none;
    font-size:11px;font-weight:600;letter-spacing:.02em;
    font-variant-numeric:tabular-nums}
  .eff{display:flex;align-items:center;gap:5px;color:currentColor;
    opacity:0;transform:scale(.85);
    transition:opacity .3s ease, transform .3s cubic-bezier(.34,1.4,.64,1)}
  .eff.on{opacity:1;transform:scale(1)}
  .eff::before{content:'';width:5px;height:5px;border-radius:50%;
    background:currentColor;box-shadow:0 0 8px currentColor;
    flex-shrink:0}

  .energy{position:fixed;bottom:0;left:0;right:0;height:1.5px;
    background:rgba(255,255,255,.025);z-index:5}
  .energy-fill{height:100%;background:#7dd3c0;width:100%;
    transition:width .12s linear,background .35s ease}
  .energy-fill.low{background:#f87171}
  .energy-fill.unlimited{background:#a855f7;
    box-shadow:0 0 20px #a855f7;
    animation:unlimPulse .8s ease-in-out infinite alternate}
  @keyframes unlimPulse{from{opacity:.7}to{opacity:1}}

  .chaos-line{position:fixed;bottom:3px;left:0;right:0;height:1.5px;z-index:5;
    opacity:0;transition:opacity .35s}
  .chaos-line.show{opacity:1}
  .chaos-line .fill{height:100%;background:#fbbf24;width:0%;
    box-shadow:0 0 14px #fbbf24;transition:width .1s linear}

  .unlim-line{position:fixed;bottom:6px;left:0;right:0;height:1.5px;z-index:5;
    opacity:0;transition:opacity .35s}
  .unlim-line.show{opacity:1}
  .unlim-line .fill{height:100%;background:#a855f7;width:0%;
    box-shadow:0 0 14px #a855f7;transition:width .1s linear}

  .overlay{position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:36px;text-align:center;background:#0a0b0f;
    opacity:0;pointer-events:none;
    transition:opacity .55s cubic-bezier(.4,0,.2,1)}
  .overlay.show{opacity:1;pointer-events:auto}

  .overlay.start > *{
    opacity:0;transform:translateY(8px);
    transition:opacity .9s cubic-bezier(.4,0,.2,1),
               transform .9s cubic-bezier(.4,0,.2,1);
  }
  .overlay.start.show > *{opacity:1;transform:translateY(0)}
  .overlay.start.show > *:nth-child(1){transition-delay:.2s}
  .overlay.start.show > *:nth-child(2){transition-delay:.7s}
  .overlay.start.show > *:nth-child(3){transition-delay:1s}

  .brand{
    font-family:'JetBrains Mono','SF Mono','Fira Code',ui-monospace,Menlo,monospace;
    font-size:clamp(28px,7.2vw,44px);font-weight:400;
    letter-spacing:-.02em;color:#e6edf3;line-height:1}
  .brand span{color:#7dd3c0}
  .brand .cur{
    display:inline-block;width:.5em;height:1em;vertical-align:-.14em;
    background:#7dd3c0;margin-left:.12em;
    animation:blink 1.1s steps(2) infinite;
    box-shadow:0 0 12px rgba(125,211,192,.6)}
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

  .overlay.over > *{
    opacity:0;transform:translateY(10px);
    transition:opacity .8s cubic-bezier(.4,0,.2,1),
               transform .8s cubic-bezier(.4,0,.2,1);
  }
  .overlay.over.show > *{opacity:1;transform:translateY(0)}
  .overlay.over.show > *:nth-child(1){transition-delay:.05s}
  .overlay.over.show > *:nth-child(2){transition-delay:.3s}
  .overlay.over.show > *:nth-child(3){transition-delay:.44s}
  .overlay.over.show > *:nth-child(4){transition-delay:.6s}
  .overlay.over.show > *:nth-child(5){transition-delay:.74s}
  .overlay.over.show > *:nth-child(6){transition-delay:.88s}

  .mark{width:24px;height:1px;background:#7dd3c0;margin-bottom:32px;
    transform:scaleX(0);transition:transform .95s cubic-bezier(.4,0,.2,1) .15s}
  .overlay.show .mark{transform:scaleX(1)}

  .btn{padding:15px 44px;border:none;border-radius:10px;
    font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;
    font-size:12px;font-weight:500;letter-spacing:.14em;
    text-transform:uppercase;cursor:pointer;
    background:#e6edf3;color:#0a0b0f;
    box-shadow:0 1px 2px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.7);
    transition:background .22s ease,transform .22s cubic-bezier(.4,0,.2,1),
      box-shadow .22s ease}
  .btn:hover{background:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.85)}
  .btn:active{transform:scale(.975);background:#c8d1dc}

  /* ── Color picker ── */
  .color-picker{
    display:flex;flex-direction:column;align-items:center;gap:16px;
    margin-top:34px}
  .preview{
    font-family:'JetBrains Mono','SF Mono','Fira Code',ui-monospace,Menlo,monospace;
    font-size:24px;font-weight:500;letter-spacing:.06em;
    color:#7dd3c0;
    transition:color .3s ease, text-shadow .3s ease;
    text-shadow:0 0 14px currentColor;
    line-height:1}
  .color-row{
    display:flex;gap:11px;flex-wrap:wrap;justify-content:center;
    max-width:280px}
  .swatch{
    position:relative;width:20px;height:20px;border-radius:50%;
    cursor:pointer;border:none;padding:0;
    transition:transform .2s cubic-bezier(.34,1.4,.64,1);
    box-shadow:inset 0 -2px 4px rgba(0,0,0,.15),
               inset 0 2px 3px rgba(255,255,255,.25);
    outline:none;-webkit-tap-highlight-color:transparent}
  .swatch:hover{transform:scale(1.18)}
  .swatch::after{
    content:'';position:absolute;inset:-5px;border-radius:50%;
    border:1.5px solid currentColor;opacity:0;
    transition:opacity .25s ease}
  .swatch.active{transform:scale(1.1)}
  .swatch.active::after{opacity:1}

  .final-label{font-size:9px;letter-spacing:.32em;text-transform:uppercase;
    color:#3f4854;font-weight:500;margin-bottom:22px}
  .final-score{
    font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;
    font-size:clamp(64px,18vw,108px);font-weight:200;
    letter-spacing:-.05em;color:#e6edf3;line-height:1;
    font-variant-numeric:tabular-nums;margin-bottom:14px}
  .final-best{font-size:11.5px;letter-spacing:.06em;color:#3f4854;
    margin-bottom:44px}
  .final-best strong{color:#7dd3c0;font-weight:500}
  .final-stats{display:flex;gap:44px;margin-bottom:48px}
  .stat{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:60px}
  .stat .label{margin-bottom:0}
  .stat .value{font-size:14px;font-weight:500;color:#7d8694}

  @media (max-width:420px){
    .hud{padding:36px 24px 0}
    .value{font-size:22px}
    .effects{gap:10px;font-size:10px}
    .final-stats{gap:30px}
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="hud">
  <div class="hud-left">
    <div class="label">Score</div>
    <div class="value" id="score">0</div>
    <div class="lives" id="lives"></div>
  </div>
  <div class="hud-right">
    <div class="label">Best</div>
    <div class="value" id="best">0</div>
  </div>
</div>

<div class="effects" id="effects"></div>

<div class="energy"><div class="energy-fill" id="energyFill"></div></div>
<div class="unlim-line" id="unlimLine"><div class="fill" id="unlimFill"></div></div>
<div class="chaos-line" id="chaosLine"><div class="fill" id="chaosFill"></div></div>

<div class="overlay start show" id="start">
  <h1 class="brand">Bcod<span>game</span><span class="cur"></span></h1>
  <button class="btn" id="startBtn">Start</button>
  <div class="color-picker">
    <div class="preview" id="preview">&lt;_&gt;</div>
    <div class="color-row" id="colorRow"></div>
  </div>
</div>

<div class="overlay over" id="over">
  <div class="mark"></div>
  <div class="final-label">Final score</div>
  <div class="final-score" id="finalScore">0</div>
  <div class="final-best" id="finalBest">Best <strong>0</strong></div>
  <div class="final-stats">
    <div class="stat"><span class="label">Depth</span><span class="value" id="statDepth">0m</span></div>
    <div class="stat"><span class="label">Collected</span><span class="value" id="statCol">0</span></div>
    <div class="stat"><span class="label">Powerups</span><span class="value" id="statPow">0</span></div>
  </div>
  <button class="btn" id="restartBtn">Again</button>
</div>

<script>
(function(){
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W,H,DPR;
function resize(){
  DPR = Math.min(devicePixelRatio||1,2);
  W = innerWidth; H = innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height='H+px'.replace('H',H);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize); resize();

const GOLD   = '251,191,36';
const CYAN   = '34,211,238';
const PURPLE = '168,85,247';
const EMER   = '16,185,129';
const PINK   = '236,72,153';
const ORANGE = '249,115,22';
const ICE    = '219,234,254';
const DANGER = '248,113,113';

// ── Character ──
const PLAYER_SYMBOL = '<_>';
const MONO = "'JetBrains Mono','SF Mono','Fira Code',ui-monospace,Menlo,monospace";

// ── Color options ──
const COLOR_OPTIONS = [
  { hex:'#7dd3c0', rgb:'125,211,192' },
  { hex:'#22d3ee', rgb:'34,211,238' },
  { hex:'#a855f7', rgb:'168,85,247' },
  { hex:'#ec4899', rgb:'236,72,153' },
  { hex:'#f97316', rgb:'249,115,22' },
  { hex:'#fbbf24', rgb:'251,191,36' },
  { hex:'#ef4444', rgb:'239,68,68' },
  { hex:'#3b82f6', rgb:'59,130,246' },
  { hex:'#10b981', rgb:'16,185,129' },
  { hex:'#e6edf3', rgb:'230,237,243' }
];
let playerColorRGB = localStorage.getItem('bcodgameColorRGB') || COLOR_OPTIONS[0].rgb;
let playerColorHex = localStorage.getItem('bcodgameColorHex') || COLOR_OPTIONS[0].hex;

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const livesEl = document.getElementById('lives');
const energyFill = document.getElementById('energyFill');
const chaosLine = document.getElementById('chaosLine');
const chaosFill = document.getElementById('chaosFill');
const unlimLine = document.getElementById('unlimLine');
const unlimFill = document.getElementById('unlimFill');
const effectsEl = document.getElementById('effects');
const startScreen = document.getElementById('start');
const overScreen = document.getElementById('over');
const finalScoreEl = document.getElementById('finalScore');
const finalBestEl = document.getElementById('finalBest');
const statDepth = document.getElementById('statDepth');
const statCol = document.getElementById('statCol');
const statPow = document.getElementById('statPow');
const colorRow = document.getElementById('colorRow');
const previewEl = document.getElementById('preview');

// ── Build color picker ──
function buildColorPicker(){
  colorRow.innerHTML = COLOR_OPTIONS.map(o =>
    '<button class="swatch" data-hex="'+o.hex+'" data-rgb="'+o.rgb+'" '+
    'style="background:'+o.hex+';color:'+o.hex+'" '+
    'aria-label="'+o.hex+'"></button>'
  ).join('');

  colorRow.querySelectorAll('.swatch').forEach(sw => {
    if(sw.dataset.rgb === playerColorRGB) sw.classList.add('active');
    sw.addEventListener('click', () => {
      playerColorHex = sw.dataset.hex;
      playerColorRGB = sw.dataset.rgb;
      localStorage.setItem('bcodgameColorHex', playerColorHex);
      localStorage.setItem('bcodgameColorRGB', playerColorRGB);
      colorRow.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      updatePreview();
    });
  });
  updatePreview();
}
function updatePreview(){
  previewEl.style.color = playerColorHex;
  previewEl.style.textShadow = '0 0 14px ' + playerColorHex;
}

const EFFECTS_CONFIG = [
  { key:'chaos',   color:'#fbbf24', get:()=>player.chaos },
  { key:'freeze',  color:'#dbeafe', get:()=>player.freeze },
  { key:'shield',  color:'#22d3ee', get:()=>player.shield },
  { key:'slow',    color:'#10b981', get:()=>player.slow },
  { key:'unlim',   color:'#a855f7', get:()=>player.unlimited },
  { key:'magnet',  color:'#ec4899', get:()=>player.magnet },
  { key:'double',  color:'#f97316', get:()=>player.double }
];
let effEls = {};
function buildEffectsUI(){
  effectsEl.innerHTML = EFFECTS_CONFIG.map(e =>
    '<div class="eff" data-k="'+e.key+'" style="color:'+e.color+'"></div>'
  ).join('');
  effEls = {};
  EFFECTS_CONFIG.forEach(e => {
    effEls[e.key] = effectsEl.querySelector('[data-k="'+e.key+'"]');
  });
}
function updateEffectsUI(){
  for(const e of EFFECTS_CONFIG){
    const el = effEls[e.key];
    const val = e.get();
    if(val > 0){
      const n = Math.ceil(val);
      if(el.textContent !== String(n)) el.textContent = n;
      if(!el.classList.contains('on')) el.classList.add('on');
    } else {
      if(el.classList.contains('on')) el.classList.remove('on');
    }
  }
}

// ── Audio ──
let actx=null;
function initAudio(){
  if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
  if(actx && actx.state==='suspended') actx.resume();
}
function tone(f,d,type,vol,to){
  if(!actx) return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  if(to) o.frequency.exponentialRampToValueAtTime(to, actx.currentTime+d);
  g.gain.setValueAtTime(vol||.035, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+d);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime+d);
}
const SFX = {
  pulse(){ tone(900,.28,'sine',.03,340); },
  collect(){ tone(1500,.07,'sine',.028); },
  hit(){ tone(160,.35,'sine',.05,80); },
  shield(){ tone(700,.25,'sine',.05,1400);
    setTimeout(()=>tone(1400,.3,'sine',.04,1800),80); },
  unlim(){ [800,1100,1400,1700].forEach((f,i)=>
    setTimeout(()=>tone(f,.2,'triangle',.05),i*70)); },
  slow(){ [900,700,500].forEach((f,i)=>
    setTimeout(()=>tone(f,.3,'sine',.05),i*80)); },
  magnet(){ [600,800,1000].forEach((f,i)=>
    setTimeout(()=>tone(f,.2,'sine',.045),i*60)); },
  double(){ [700,900,1200,1600,2000].forEach((f,i)=>
    setTimeout(()=>tone(f,.15,'triangle',.045),i*50)); },
  freeze(){ tone(1400,.4,'sine',.05,200);
    setTimeout(()=>tone(2200,.3,'sine',.04,600),80); },
  block(){ tone(500,.2,'sine',.05,900); },
  chaos(){ tone(400,.5,'sine',.05,1600);
    setTimeout(()=>tone(900,.4,'sine',.045,2000),100); },
  smash(){ tone(1200,.15,'sine',.05,300); },
  over(){ [500,400,320,240].forEach((f,i)=>setTimeout(()=>tone(f,.4,'sine',.035),i*180)); }
};

let state = 'menu';
let player;
let predators, plankton;
let superPoints, shieldPoints, unlimPoints, slowPoints, magnetPoints, doublePoints, freezePoints;
let pulses, particles, dust;
let score, best, lives, level, collected, depth;
let powerupCount;
let shake, time;
let spawnP, spawnPl, spawnSpecial;
let pickupQueue = [];
let chaosTotal, unlimTotal;
let lastTime = 0;
let keys = {left:false,right:false};
let pointerActive = false, pointerX = 0;

best = Number(localStorage.getItem('bcodgameBest'))||0;
bestEl.textContent = best;

function shuffleQueue(){
  pickupQueue = ['super','shield','unlim','slow','magnet','double','freeze'];
  for(let i=pickupQueue.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [pickupQueue[i], pickupQueue[j]] = [pickupQueue[j], pickupQueue[i]];
  }
}
function spawnNextSpecial(){
  if(pickupQueue.length === 0) shuffleQueue();
  const type = pickupQueue.pop();
  switch(type){
    case 'super':  makePickup(superPoints, 45, 12); break;
    case 'shield': makePickup(shieldPoints, 50, 11); break;
    case 'unlim':  makePickup(unlimPoints, 50, 11); break;
    case 'slow':   makePickup(slowPoints, 48, 11); break;
    case 'magnet': makePickup(magnetPoints, 48, 11); break;
    case 'double': makePickup(doublePoints, 46, 11); break;
    case 'freeze': makePickup(freezePoints, 52, 11); break;
  }
}
function makePickup(arr, vy, r){
  arr.push({
    x: 90+Math.random()*(W-180), y: -50,
    vy: vy||50, r: r||11,
    phase: Math.random()*6.28, rot: 0
  });
}

function initGame(){
  player = {x:W/2, y:H-140, targetX:W/2, size:22, tentaclePhase:0,
    energy:1, hitCooldown:0, trail:[],
    chaos:0, shield:0, unlimited:0, slow:0, magnet:0, double:0, freeze:0};
  predators = []; plankton = [];
  superPoints = []; shieldPoints = []; unlimPoints = [];
  slowPoints = []; magnetPoints = []; doublePoints = []; freezePoints = [];
  pulses = []; particles = []; dust = [];
  score = 0; lives = 3; level = 1; collected = 0; depth = 0;
  powerupCount = 0;
  shake = 0; time = 0; spawnP = 50; spawnPl = 30;
  spawnSpecial = 4;
  chaosTotal = 4.0;
  unlimTotal = 6.0;
  shuffleQueue();
  pointerX = W/2; pointerActive = false;
  for(let i=0;i<40;i++) dust.push(makeDust());
  updateHUD(); updateEnergy(); updateEffectsUI();
  chaosLine.classList.remove('show');
  unlimLine.classList.remove('show');
}
function makeDust(){
  return {x:Math.random()*W, y:Math.random()*H,
    size:.5+Math.random()*1.2,
    vy:5+Math.random()*15, vx:(Math.random()-.5)*6,
    alpha:.1+Math.random()*.35, phase:Math.random()*6.28};
}
function updateHUD(){
  const is = Math.floor(score);
  if(scoreEl.textContent !== String(is)){
    scoreEl.textContent = is;
    scoreEl.classList.remove('pop'); void scoreEl.offsetWidth;
    scoreEl.classList.add('pop');
    setTimeout(()=>scoreEl.classList.remove('pop'), 180);
  }
  bestEl.textContent = best;
  livesEl.innerHTML = '';
  for(let i=0;i<3;i++){
    const l = document.createElement('div');
    l.className = 'life' + (i<lives?'':' dead');
    livesEl.appendChild(l);
  }
}
function updateEnergy(){
  if(player.unlimited > 0){
    energyFill.style.width = '100%';
    energyFill.classList.remove('low');
    energyFill.classList.add('unlimited');
  } else {
    energyFill.style.width = (player.energy*100)+'%';
    energyFill.classList.toggle('low', player.energy < 0.34 && player.chaos<=0);
    energyFill.classList.remove('unlimited');
  }
}

function spawnPredator(){
  const hidden = Math.random() < Math.min(0.80, 0.55 + level*0.03);
  const big = Math.random() < .14;
  const r = big ? 36+Math.random()*16 : 16+Math.random()*12;
  predators.push({
    x:40+Math.random()*(W-80), y:-60,
    vy:55+Math.random()*40+level*9, vx:(Math.random()-.5)*24,
    size:r, big, hidden, reveal:0,
    angle:Math.random()*6.28, rot:(Math.random()-.5)*2,
    pushVx:0, pushVy:0, wobble:Math.random()*6.28
  });
}
function spawnPlankton(){
  const cluster = Math.random() < .4;
  if(cluster){
    const cx = 80+Math.random()*(W-160);
    const n = 3+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++) plankton.push(makePlank(cx+(Math.random()-.5)*60, -20-i*20));
  } else {
    plankton.push(makePlank(50+Math.random()*(W-100), -20));
  }
}
function makePlank(x,y){
  return {x,y,
    vy:40+Math.random()*25, vx:(Math.random()-.5)*12,
    size:3+Math.random()*2, phase:Math.random()*6.28, px:0, py:0};
}

function triggerChaos(){
  player.chaos = 4.0;
  player.energy = 1;
  SFX.chaos(); shake = .5;
  for(let i=0;i<60;i++){
    const a=Math.random()*6.28, sp=3+Math.random()*8;
    particles.push({x:player.x,y:player.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,

function emitPulse(){
  if(state !== 'play') return;
  const chaos = player.chaos > 0;
  const unlim = player.unlimited > 0;
  if(!chaos && !unlim && player.energy < .34) return;
  if(!chaos && !unlim) player.energy = Math.max(0, player.energy - .34);
  const maxR = chaos ? 520 + level*10 : 300 + level*8;
  pulses.push({x:player.x, y:player.y, r:14,
    maxR:maxR, speed: chaos?720:540, life:1, chaos: chaos});
  SFX.pulse();
  const n = chaos ? 18 : 10;
  for(let i=0;i<n;i++){
    const a = (i/n)*6.28;
    particles.push({
      x:player.x, y:player.y,
      vx:Math.cos(a)*(chaos?7:4), vy:Math.sin(a)*(chaos?7:4),
      life:1, size: chaos?3:2,
      hue: chaos ? GOLD : (unlim ? PURPLE : playerColorRGB)
    });
  }
  updateEnergy();
}
addEventListener('keydown', e=>{
  if(e.code==='Space'){ e.preventDefault();
    if(state!=='play'){ startGame(); return; }
    emitPulse();
  }
  if(e.key==='ArrowLeft'||e.key==='a') keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d') keys.right=true;
});
addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft'||e.key==='a') keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d') keys.right=false;
});
function setPtr(x){ pointerActive=true; pointerX=x; }
canvas.addEventListener('mousemove', e=>setPtr(e.clientX));
canvas.addEventListener('touchmove', e=>{e.preventDefault();setPtr(e.touches[0].clientX);},{passive:false});
canvas.addEventListener('mousedown', e=>{e.preventDefault(); if(state==='play') emitPulse();});
canvas.addEventListener('touchstart', e=>{e.preventDefault();
  if(state==='play'){ setPtr(e.touches[0].clientX); emitPulse(); }},{passive:false});

function update(dt){
  time += dt;

  for(const d of dust){
    d.y += d.vy*dt;
    d.x += d.vx*dt + Math.sin(time + d.phase)*4*dt;
    d.phase += dt*1.5;
    if(d.y > H+10){ d.y=-10; d.x=Math.random()*W; }
  }
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx*dt*60; p.y += p.vy*dt*60;
    p.vx *= .94; p.vy *= .94;
    p.life -= dt*1.6;
    if(p.life<=0) particles.splice(i,1);
  }

  if(state !== 'play'){ if(shake>0) shake -= dt*2; return; }
  if(shake>0) shake -= dt*2;
  if(player.hitCooldown>0) player.hitCooldown -= dt;

  if(player.chaos > 0){
    player.chaos -= dt;
    chaosFill.style.width = (player.chaos / chaosTotal * 100) + '%';
    if(player.chaos <= 0){ player.chaos = 0; chaosLine.classList.remove('show'); }
  }
  if(player.shield > 0){ player.shield -= dt; if(player.shield<0) player.shield=0; }
  if(player.unlimited > 0){
    player.unlimited -= dt;
    unlimFill.style.width = (player.unlimited / unlimTotal * 100) + '%';
    if(player.unlimited <= 0){ player.unlimited = 0; unlimLine.classList.remove('show'); }
  }
  if(player.slow > 0){ player.slow -= dt; if(player.slow<0) player.slow=0; }
  if(player.magnet > 0){ player.magnet -= dt; if(player.magnet<0) player.magnet=0; }
  if(player.double > 0){ player.double -= dt; if(player.double<0) player.double=0; }
  if(player.freeze > 0){ player.freeze -= dt; if(player.freeze<0) player.freeze=0; }

  updateEffectsUI();

  if(player.chaos > 0 || player.unlimited > 0) player.energy = 1;
  else player.energy = Math.min(1, player.energy + dt*.42);
  updateEnergy();

  if(pointerActive) player.targetX = pointerX;
  else {
    if(keys.left) player.targetX -= 620*dt;
    if(keys.right) player.targetX += 620*dt;
  }
  player.targetX = Math.max(50, Math.min(W-50, player.targetX));
  player.x += (player.targetX - player.x) * Math.min(dt*14, 1);
  player.tentaclePhase += dt*3.5;

  player.trail.unshift({x:player.x, y:player.y, life:.4});
  if(player.trail.length>12) player.trail.pop();
  for(let i=player.trail.length-1;i>=0;i--){
    player.trail[i].life -= dt;
    if(player.trail[i].life <= 0) player.trail.splice(i,1);
  }

  spawnP -= dt*60;
  if(spawnP<=0){ spawnPredator(); spawnP = Math.max(24, 72-level*4) + Math.random()*22; }
  spawnPl -= dt*60;
  if(spawnPl<=0){ spawnPlankton(); spawnPl = Math.max(30, 90-level*3) + Math.random()*40; }

  spawnSpecial -= dt;
  if(spawnSpecial <= 0){
    spawnNextSpecial();
    spawnSpecial = 9 + Math.random()*5;
  }

  for(let i=pulses.length-1;i>=0;i--){
    const p = pulses[i];
    p.r += p.speed*dt; p.life -= dt*.9;
    if(p.life<=0 || p.r>p.maxR) pulses.splice(i,1);
  }

  depth += dt*.9;

  const hitR = player.size*.85;
  const chaos = player.chaos > 0;
  const scoreMul = player.double > 0 ? 2 : 1;
  const tScale = player.freeze > 0 ? 0 : (player.slow > 0 ? 0.35 : 1);

  function tryPickup(arr, triggerFn){
    for(let i=arr.length-1;i>=0;i--){
      const sp = arr[i];
      sp.phase += dt*3;
      sp.rot += dt*1.5;
      sp.y += sp.vy*dt;
      for(const p of pulses){
        const dx=sp.x-p.x, dy=sp.y-p.y;
        const d=Math.hypot(dx,dy);
        if(d < p.r && d>0.1){
          const pull = (1-d/p.r)*400;
          sp.x += dx/d*pull*dt; sp.y += dy/d*pull*dt;
        }
      }
      const dx=player.x-sp.x, dy=player.y-sp.y;
      const d=Math.hypot(dx,dy);
      if(d < hitR + sp.r + 16){ powerupCount++; triggerFn(); arr.splice(i,1); continue; }
      if(sp.y > H+40) arr.splice(i,1);
    }
  }
  tryPickup(superPoints, triggerChaos);
  tryPickup(shieldPoints, triggerShield);
  tryPickup(unlimPoints, triggerUnlimited);
  tryPickup(slowPoints, triggerSlow);
  tryPickup(magnetPoints, triggerMagnet);
  tryPickup(doublePoints, triggerDouble);
  tryPickup(freezePoints, triggerFreeze);

  for(let i=predators.length-1;i>=0;i--){
    const pr = predators[i];
    pr.wobble += dt*4*tScale;
    pr.angle += pr.rot*dt*tScale;
    pr.y += (pr.vy + pr.pushVy)*dt*tScale;
    pr.x += (pr.vx + pr.pushVx + Math.sin(pr.wobble)*12)*dt*tScale;
    pr.pushVx *= .9; pr.pushVy *= .9;
    if(pr.reveal>0) pr.reveal -= dt;

    for(const p of pulses){
      const dx = pr.x-p.x, dy = pr.y-p.y;
      const d = Math.hypot(dx,dy);
      if(Math.abs(d-p.r)<42 && d>.1){
        const force = (1-p.r/p.maxR)*(p.chaos?1500:900);
        pr.pushVx += (dx/d)*force*dt;
        pr.pushVy += (dy/d)*force*dt;
        if(pr.hidden) pr.reveal = 1.4;
      }
    }

    const dx = pr.x-player.x, dy = pr.y-player.y;
    const d = Math.hypot(dx,dy);
    const colR = hitR + pr.size*.85;

    if(d < colR){
      if(chaos){
        score += 50 * scoreMul;
        SFX.smash(); shake = .35;
        for(let j=0;j<20;j++){
          const a=Math.random()*6.28, sp=2+Math.random()*6;
          particles.push({x:pr.x,y:pr.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
            life:1.2,size:2+Math.random()*2,hue:Math.random()<0.5?GOLD:DANGER});
        }
        predators.splice(i,1);
        updateHUD();
        continue;
      } else if(player.shield > 0){
        player.shield = 0;
        player.hitCooldown = 0.8;
        SFX.block(); shake = .3;
        for(let j=0;j<26;j++){
          const a=Math.random()*6.28, sp=3+Math.random()*5;
          particles.push({x:player.x,y:player.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
            life:1.2,size:2.5,hue:CYAN});
        }
        pr.pushVx += (dx/(d||1))*700;
        pr.pushVy += (dy/(d||1))*700;
        score += 15 * scoreMul;
        updateHUD();
      } else if(player.hitCooldown<=0){
        player.hitCooldown = 1.5;
        lives--; shake = .45;
        SFX.hit();
        for(let j=0;j<20;j++){
          const a=Math.random()*6.28;
          particles.push({x:player.x,y:player.y,vx:Math.cos(a)*5,vy:Math.sin(a)*5,
            life:1,size:2.5,hue:DANGER});
        }
        pr.pushVx += (dx/(d||1))*500;
        pr.pushVy += (dy/(d||1))*500;
        updateHUD();
        if(lives<=0){ endGame(); return; }
      }
    }

    if(pr.y > H+80 || pr.y < -300 || pr.x < -150 || pr.x > W+150){
      if(pr.y > H+40) score += 8 * scoreMul;
      predators.splice(i,1);
    }
  }

  for(let i=plankton.length-1;i>=0;i--){
    const pl = plankton[i];
    pl.phase += dt*4;
    pl.y += pl.vy*dt; pl.x += pl.vx*dt;

    for(const p of pulses){
      const pdx=pl.x-p.x, pdy=pl.y-p.y;
      const pd=Math.hypot(pdx,pdy);
      if(pd < p.r){
        const pull = (1-pd/p.r)*500;
        pl.px += (p.x-pl.x)/(pd||1)*pull*dt;
        pl.py += (p.y-pl.y)/(pd||1)*pull*dt;
      }
    }
    if(player.magnet > 0){
      const dx = player.x - pl.x, dy = player.y - pl.y;
      const d = Math.hypot(dx,dy);
      const pull = 480;
      pl.px += dx/(d||1) * pull * dt;
      pl.py += dy/(d||1) * pull * dt;
    }

    pl.x += pl.px*dt*4; pl.y += pl.py*dt*4;
    pl.px *= .94; pl.py *= .94;

    const dx=player.x-pl.x, dy=player.y-pl.y;
    const d=Math.hypot(dx,dy);
    if(d < hitR + pl.size + 14){
      collected++;
      score += (chaos ? 30 : 12) * scoreMul;
      SFX.collect();
      for(let j=0;j<6;j++){
        const a=Math.random()*6.28;
        particles.push({x:pl.x,y:pl.y,vx:Math.cos(a)*2.5,vy:Math.sin(a)*2.5,
          life:1,size:1.8,hue:playerColorRGB});
      }
      plankton.splice(i,1);
      updateHUD();
      continue;
    }
    if(pl.y > H+40) plankton.splice(i,1);
  }

  const nl = 1 + Math.floor(score/300);
  if(nl > level){
    level = nl;
    for(let j=0;j<24;j++){
      const a=Math.random()*6.28;
      particles.push({x:player.x,y:player.y,vx:Math.cos(a)*4,vy:Math.sin(a)*4,
        life:1,size:2,hue:playerColorRGB});
    }
  }

  score += dt*3*scoreMul;
  updateHUD();
}

function draw(){
  const bg = ctx.createRadialGradient(W/2,H*.35,0,W/2,H*.35,Math.max(W,H)*.85);
  bg.addColorStop(0,'#0e1116'); bg.addColorStop(1,'#07080b');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  const chaos = state==='play' && player.chaos > 0;
  const unlim = state==='play' && player.unlimited > 0;

  if(chaos){
    const t = ctx.createRadialGradient(W/2,H*.5,0,W/2,H*.5,Math.max(W,H)*.8);
    t.addColorStop(0,'rgba('+GOLD+',0.05)'); t.addColorStop(1,'rgba('+GOLD+',0)');
    ctx.fillStyle = t; ctx.fillRect(0,0,W,H);
  }
  if(unlim && !chaos){
    const t = ctx.createRadialGradient(W/2,H*.5,0,W/2,H*.5,Math.max(W,H)*.8);
    t.addColorStop(0,'rgba('+PURPLE+',0.05)'); t.addColorStop(1,'rgba('+PURPLE+',0)');
    ctx.fillStyle = t; ctx.fillRect(0,0,W,H);
  }
  if(state==='play' && player.freeze > 0){
    const t = ctx.createRadialGradient(W/2,H*.5,0,W/2,H*.5,Math.max(W,H)*.8);
    t.addColorStop(0,'rgba('+ICE+',0.05)'); t.addColorStop(1,'rgba('+ICE+',0)');
    ctx.fillStyle = t; ctx.fillRect(0,0,W,H);
  }

  ctx.save();
  if(shake > 0){
    const s = shake*14;
    ctx.translate((Math.random()-.5)*s,(Math.random()-.5)*s);
  }

  for(const d of dust){
    const a = d.alpha * (.6 + Math.sin(d.phase)*.4);
    ctx.fillStyle = 'rgba('+(chaos?GOLD:(unlim?PURPLE:playerColorRGB))+','+a+')';
    ctx.beginPath(); ctx.arc(d.x,d.y,d.size,0,6.28); ctx.fill();
  }

  if(state !== 'menu'){
    drawPlankton();
    drawPredators();
    drawPickupGroup(superPoints, 'star', GOLD);
    drawPickupGroup(shieldPoints, 'hex', CYAN);
    drawPickupGroup(unlimPoints, 'diamond', PURPLE);
    drawPickupGroup(slowPoints, 'target', EMER);
    drawPickupGroup(magnetPoints, 'infinity', PINK);
    drawPickupGroup(doublePoints, 'bars', ORANGE);
    drawPickupGroup(freezePoints, 'snow', ICE);
    drawPlayer();
  }

  for(const p of pulses) drawPulse(p);

  for(const p of particles){
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = 'rgba('+(p.hue||playerColorRGB)+',1)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size*Math.min(1,p.life), 0, 6.28);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawPulse(p){
  const a = p.life*.7;
  let col = playerColorRGB;
  if(p.chaos) col = GOLD;
  else if(p.shield) col = CYAN;
  else if(p.unlim) col = PURPLE;
  else if(p.slow) col = EMER;
  else if(p.magnet) col = PINK;
  else if(p.dbl) col = ORANGE;
  else if(p.ice) col = ICE;

  ctx.strokeStyle = 'rgba('+col+','+a+')';
  ctx.lineWidth = p.chaos ? 6 : 4;
  ctx.beginPath(); ctx.arc(p.x,p.y,p.r*.98,0,6.28); ctx.stroke();
  ctx.strokeStyle = 'rgba('+col+','+(a*1.2)+')';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.stroke();
}

function drawPlankton(){
  for(const pl of plankton){
    const pulse = .85 + Math.sin(pl.phase)*.15;
    ctx.fillStyle = 'rgba('+playerColorRGB+',0.10)';
    ctx.beginPath(); ctx.arc(pl.x,pl.y,pl.size*3,0,6.28); ctx.fill();
    ctx.fillStyle = 'rgba('+playerColorRGB+','+(0.85*pulse)+')';
    ctx.beginPath(); ctx.arc(pl.x,pl.y,pl.size*pulse,0,6.28); ctx.fill();
  }
}

function drawPredators(){
  const frozen = player.freeze > 0;
  const slowed = player.slow > 0 && !frozen;
  for(const pr of predators){
    if(pr.hidden && pr.reveal <= 0){
      ctx.save();
      ctx.globalAlpha = 0.05 + Math.sin(time*3 + pr.wobble)*0.03;
      ctx.translate(pr.x, pr.y); ctx.rotate(pr.angle);
      ctx.fillStyle = 'rgba('+DANGER+',0.6)';
      const spikes = pr.big ? 8 : 6;
      ctx.beginPath();
      for(let i=0;i<spikes;i++){
        const a=(i/spikes)*6.28;
        const noise = 1 + Math.sin(pr.wobble + i*1.7)*.18;
        const rr = pr.size*noise;
        const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
      continue;
    }

    const revealAlpha = pr.hidden ? Math.max(0, pr.reveal) : 1;
    ctx.save();
    ctx.globalAlpha = revealAlpha;
    ctx.translate(pr.x, pr.y); ctx.rotate(pr.angle);
    ctx.fillStyle = 'rgba(22,16,28,0.95)';
    const spikes = pr.big ? 8 : 6;
    ctx.beginPath();
    for(let i=0;i<spikes;i++){
      const a=(i/spikes)*6.28;
      const noise = 1 + Math.sin(pr.wobble + i*1.7)*.18;
      const rr = pr.size*noise;
      const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();

    if(frozen){
      ctx.strokeStyle = 'rgba('+ICE+','+(0.8 + Math.sin(time*6)*0.2)+')';
      ctx.lineWidth = 1.4;
    } else if(slowed){
      ctx.strokeStyle = 'rgba('+EMER+','+(0.55 + Math.sin(time*4)*0.2)+')';
      ctx.lineWidth = 1.2;
    } else {
      ctx.strokeStyle = 'rgba('+DANGER+','+(.35 + Math.sin(time*5)*.15)+')';
      ctx.lineWidth = 1;
    }
    ctx.stroke();
    ctx.restore();
  }
}

function drawPickupGroup(arr, shape, color){
  for(const sp of arr){
    const pulse = .8 + Math.sin(sp.phase)*.2;
    ctx.save();
    ctx.translate(sp.x, sp.y);

    const g = ctx.createRadialGradient(0,0,0,0,0,sp.r*4.5);
    g.addColorStop(0, 'rgba('+color+','+(0.55*pulse)+')');
    g.addColorStop(0.5, 'rgba('+color+','+(0.16*pulse)+')');
    g.addColorStop(1, 'rgba('+color+',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,sp.r*4.5,0,6.28); ctx.fill();

    ctx.strokeStyle = 'rgba('+color+','+(0.8*pulse)+')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0,0,sp.r*1.8,0,6.28); ctx.stroke();

    ctx.rotate(sp.rot);

    if(shape === 'star'){
      ctx.fillStyle = 'rgba('+color+',1)';
      ctx.beginPath();
      for(let i=0;i<8;i++){
        const a = (i/8)*6.28 - 1.57;
        const rr = i%2 === 0 ? sp.r : sp.r*0.42;
        const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,250,220,1)';
      ctx.beginPath(); ctx.arc(0,0,sp.r*0.35,0,6.28); ctx.fill();
    }
    else if(shape === 'hex'){
      ctx.strokeStyle = 'rgba('+color+',1)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a = (i/6)*6.28 - 1.57;
        const px=Math.cos(a)*sp.r, py=Math.sin(a)*sp.r;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.stroke();
      ctx.fillStyle = 'rgba('+color+',0.9)';
      ctx.beginPath(); ctx.arc(0,0,sp.r*0.32,0,6.28); ctx.fill();
    }
    else if(shape === 'diamond'){
      ctx.fillStyle = 'rgba('+color+',1)';
      ctx.beginPath();
      ctx.moveTo(0,-sp.r);
      ctx.lineTo(sp.r*0.7,0);
      ctx.lineTo(0,sp.r);
      ctx.lineTo(-sp.r*0.7,0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.arc(-sp.r*0.18,0,sp.r*0.16,0,6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(sp.r*0.18,0,sp.r*0.16,0,6.28); ctx.fill();
    }
    else if(shape === 'target'){
      ctx.strokeStyle = 'rgba('+color+',1)';
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(0,0,sp.r,0,6.28); ctx.stroke();
      ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(0,0,sp.r*0.6,0,6.28); ctx.stroke();
      ctx.fillStyle = 'rgba('+color+',1)';
      ctx.beginPath(); ctx.arc(0,0,sp.r*0.22,0,6.28); ctx.fill();
    }
    else if(shape === 'infinity'){
      ctx.strokeStyle = 'rgba('+color+',1)';
      ctx.lineWidth = 1.7;
      ctx.beginPath(); ctx.arc(-sp.r*0.42,0,sp.r*0.52,0,6.28); ctx.stroke();
      ctx.beginPath(); ctx.arc(sp.r*0.42,0,sp.r*0.52,0,6.28); ctx.stroke();
    }
    else if(shape === 'bars'){
      ctx.fillStyle = 'rgba('+color+',1)';
      ctx.fillRect(-sp.r*0.5, -sp.r*0.75, sp.r*0.32, sp.r*1.5);
      ctx.fillRect(sp.r*0.18, -sp.r*0.75, sp.r*0.32, sp.r*1.5);
    }
    else if(shape === 'snow'){
      ctx.strokeStyle = 'rgba('+color+',1)';
      ctx.lineWidth = 1.5;
      for(let i=0;i<6;i++){
        const a = (i/6)*6.28;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(a)*sp.r, Math.sin(a)*sp.r);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba('+color+',1)';
      ctx.beginPath(); ctx.arc(0,0,sp.r*0.2,0,6.28); ctx.fill();
    }

    ctx.restore();
  }
}

// ── PREMIUM PLAYER with user-chosen color ──
function drawPlayer(){
  const {x,y,size} = player;
  const blink = player.hitCooldown>0 && player.chaos<=0 && player.shield<=0 && Math.floor(time*20)%2===0;
  const chaos = player.chaos > 0;
  const shielded = player.shield > 0;
  const unlim = player.unlimited > 0;
  const col = chaos ? GOLD : playerColorRGB;      // ← ব্যবহারকারীর রঙ

  ctx.save();
  if(blink) ctx.globalAlpha = .45;

  // Soft trail
  for(let i=player.trail.length-1;i>=0;i--){
    const t = player.trail[i];
    const a = (t.life/.4)*.18;
    const r = size*(t.life/.4)*1.8;
    const g = ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,r);
    g.addColorStop(0,'rgba('+col+','+a+')');
    g.addColorStop(1,'rgba('+col+',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(t.x,t.y,r,0,6.28); ctx.fill();
  }

  // Breathing glow
  const breathe = 0.92 + Math.sin(time * 1.6) * 0.08;
  const glowR = size * (chaos ? 3.0 : 2.4) * breathe;
  const g = ctx.createRadialGradient(x,y,0,x,y,glowR);
  g.addColorStop(0,'rgba('+col+','+(chaos?0.5:0.28)+')');
  g.addColorStop(0.55,'rgba('+col+',0.05)');
  g.addColorStop(1,'rgba('+col+',0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x,y,glowR,0,6.28); ctx.fill();

  // Base ring
  const baseRingA = 0.12 + Math.sin(time * 2) * 0.04;
  ctx.strokeStyle = 'rgba('+col+','+baseRingA+')';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x,y,size*1.6,0,6.28); ctx.stroke();

  // Chaos ring
  if(chaos){
    ctx.strokeStyle = 'rgba('+GOLD+',0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x,y,size*1.8,0,6.28); ctx.stroke();
  }
  // Unlimited ring
  if(unlim && !chaos){
    ctx.strokeStyle = 'rgba('+PURPLE+',0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x,y,size*1.75,0,6.28); ctx.stroke();
  }

  // Shield bubble
  if(shielded){
    const sAlpha = Math.min(1, player.shield / 2.5);
    const sR = size * 1.95;
    const sg = ctx.createRadialGradient(x,y,size*0.9,x,y,sR);
    sg.addColorStop(0,'rgba('+CYAN+',0)');
    sg.addColorStop(0.75,'rgba('+CYAN+','+(0.10*sAlpha)+')');
    sg.addColorStop(1,'rgba('+CYAN+','+(0.02*sAlpha)+')');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(x,y,sR,0,6.28); ctx.fill();
    ctx.strokeStyle = 'rgba('+CYAN+','+(0.42*sAlpha)+')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x,y,sR,0,6.28); ctx.stroke();
  }

  // ── <_> symbol in user-chosen color ──
  const symSize = size * 1.55;
  const bob = Math.sin(time * 2.4) * 0.9;

  ctx.save();
  ctx.translate(x, y + bob);

  ctx.font = '500 ' + symSize + 'px ' + MONO;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba('+col+','+(chaos?0.85:0.55)+')';
  ctx.shadowBlur = chaos ? 22 : 14;
  ctx.fillStyle = chaos ? '#ffeab8' : playerColorHex;    // ← এখানে hex রঙ
  ctx.fillText(PLAYER_SYMBOL, 0, 0);
  ctx.shadowBlur = 0;

  // Underline
  const underW = size * 1.5;
  const underY = symSize * 0.52;
  const pulseA = 0.55 + Math.sin(time * 3) * 0.2;
  ctx.strokeStyle = 'rgba('+col+','+pulseA+')';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-underW/2, underY);
  ctx.lineTo(underW/2, underY);
  ctx.stroke();

  // Shine
  const cycle = (time * 0.4) % 5;
  if(cycle < 1){
    const t01 = cycle;
    const a = Math.sin(t01 * Math.PI);
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, size * 1.2, 0, 6.28);
    ctx.clip();
    const cx = -size*1.5 + t01 * size * 3;
    const sh = ctx.createLinearGradient(cx - size*0.5, -size, cx + size*0.5, size);
    sh.addColorStop(0, 'rgba(255,255,255,0)');
    sh.addColorStop(0.5, 'rgba(255,255,255,'+(a*0.35)+')');
    sh.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sh;
    ctx.fillRect(-size*1.5, -size*1.5, size*3, size*3);
    ctx.restore();
  }

  ctx.restore();
  ctx.restore();
}

function loop(t){
  if(!lastTime) lastTime = t;
  let dt = (t-lastTime)/1000;
  lastTime = t;
  if(dt > .05) dt = .05;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function startGame(){
  initAudio();
  initGame();
  state = 'play';
  startScreen.classList.remove('show');
  overScreen.classList.remove('show');
}
function endGame(){
  state = 'over';
  SFX.over();
  const isNew = score > best;
  if(isNew){ best = Math.floor(score); localStorage.setItem('bcodgameBest', best); }
  animateNumber(finalScoreEl, 0, Math.floor(score), 1000);
  finalBestEl.innerHTML = 'Best <strong>'+best+'</strong>';
  statDepth.textContent = Math.floor(depth)+'m';
  statCol.textContent = collected;
  statPow.textContent = powerupCount;
  effectsEl.innerHTML = '';
  setTimeout(()=>overScreen.classList.add('show'), 320);
}
function animateNumber(el, from, to, dur){
  const start = performance.now();
  function step(now){
    const t = Math.min((now-start)/dur, 1);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = Math.floor(from + (to-from)*eased);
    if(t<1) requestAnimationFrame(step);
    else el.textContent = to;
  }
  requestAnimationFrame(step);
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

buildColorPicker();
buildEffectsUI();
initGame();
state = 'menu';
requestAnimationFrame(loop);

})();
</script>
