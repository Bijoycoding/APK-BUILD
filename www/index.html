<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>পাসওয়ার্ড চেকার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-tap-highlight-color: transparent; }
button, .chk, .item, .tab {
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
input, textarea { -webkit-user-select: text; user-select: text; }
button {
  font: inherit; outline: none;
  -webkit-appearance: none; appearance: none;
  border: none; background: none;
  cursor: pointer; color: inherit;
}
button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
input:focus, textarea:focus { outline: none; }

[data-theme="dark"] {
  --bg: #09090B; --surface: #121214; --surface-2: #18181B; --surface-3: #1F1F23;
  --border: #26262B; --border-2: #35353C;
  --text: #EDEDEF; --text-2: #9C9CA6; --text-3: #6C6C75; --text-4: #4A4A52;
  --btn-bg: #EDEDEF; --btn-fg: #09090B;
  --weak: #EF4444; --fair: #F59E0B; --good: #A78BFA; --strong: #34D399; --vstrong: #22D3EE;
  --overlay: rgba(0,0,0,0.7);
}
[data-theme="light"] {
  --bg: #FAFAFA; --surface: #FFFFFF; --surface-2: #F4F4F5; --surface-3: #EBEBED;
  --border: #E4E4E7; --border-2: #D4D4D8;
  --text: #18181B; --text-2: #52525B; --text-3: #71717A; --text-4: #A1A1AA;
  --btn-bg: #18181B; --btn-fg: #FAFAFA;
  --weak: #DC2626; --fair: #D97706; --good: #7C3AED; --strong: #059669; --vstrong: #0891B2;
  --overlay: rgba(15,15,20,0.5);
}

body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 13.5px; line-height: 1.45; min-height: 100vh;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  transition: background 0.2s, color 0.2s;
}
.shell { max-width: 640px; margin: 0 auto; padding: 24px 20px 80px; }

.head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
}
.logo {
  font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600;
  letter-spacing: -0.02em; color: var(--text);
}
.logo span { color: var(--text-4); font-weight: 400; }
.theme-btn {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); border-radius: 6px;
  color: var(--text-2); transition: all 0.14s;
}
.theme-btn:hover { border-color: var(--border-2); color: var(--text); }
.theme-btn:active { background: var(--surface-2); }
.theme-btn svg { width: 14px; height: 14px; }

.pw-field {
  display: flex; align-items: stretch;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; transition: border-color 0.14s, box-shadow 0.14s;
  height: 52px; overflow: hidden;
}
.pw-field:focus-within {
  border-color: var(--text-3);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--text) 6%, transparent);
}
#pw-input {
  flex: 1; background: none; border: none; padding: 0 16px;
  font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 500;
  color: var(--text); letter-spacing: 0.02em; caret-color: var(--text); min-width: 0;
}
#pw-input::placeholder { color: var(--text-4); font-weight: 400; letter-spacing: 0.04em; }
.icon-btn {
  width: 46px; display: flex; align-items: center; justify-content: center;
  color: var(--text-3); border-left: 1px solid var(--border);
  transition: color 0.14s, background 0.14s; flex-shrink: 0;
}
.icon-btn:hover { color: var(--text); background: var(--surface-2); }
.icon-btn.copied { color: var(--strong); }

.meter-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin: 16px 0 8px; font-size: 12.5px;
}
.meter-strength { font-weight: 600; color: var(--text-3); transition: color 0.2s; }
.meter-strength.c-weak { color: var(--weak); }
.meter-strength.c-fair { color: var(--fair); }
.meter-strength.c-good { color: var(--good); }
.meter-strength.c-strong { color: var(--strong); }
.meter-strength.c-vstrong { color: var(--vstrong); }
.meter-time {
  font-family: 'JetBrains Mono', monospace; font-size: 11.5px;
  color: var(--text-3); font-weight: 400;
}
.meter-bar { height: 3px; background: var(--border); border-radius: 99px; overflow: hidden; }
.meter-fill {
  height: 100%; width: 0%; background: var(--text-4); border-radius: 99px;
  transition: width 0.45s cubic-bezier(0.4,0,0.2,1), background 0.3s;
}

.stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  margin-top: 20px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--surface); overflow: hidden;
}
.stat { padding: 14px 16px; border-right: 1px solid var(--border); }
.stat:last-child { border-right: none; }
.stat-k {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500;
  color: var(--text-4); letter-spacing: 0.06em; text-transform: uppercase;
  margin-bottom: 6px; display: block;
}
.stat-v {
  font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500;
  color: var(--text); letter-spacing: -0.01em;
}

.checks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.chk {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 11px 5px 9px;
  border: 1px solid var(--border); border-radius: 100px;
  font-size: 11.5px; font-weight: 500;
  color: var(--text-4); transition: all 0.18s;
}
.chk::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-4); transition: background 0.18s; flex-shrink: 0;
}
.chk.pass {
  color: var(--text);
  border-color: color-mix(in srgb, var(--strong) 35%, transparent);
  background: color-mix(in srgb, var(--strong) 7%, transparent);
}
.chk.pass::before { background: var(--strong); }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.btn {
  height: 42px; padding: 0 16px; border-radius: 6px;
  font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center;
  gap: 7px; transition: all 0.14s; white-space: nowrap;
}
.btn-primary { background: var(--btn-bg); color: var(--btn-fg); }
.btn-primary:hover { opacity: 0.9; }
.btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-ghost { border: 1px solid var(--border); color: var(--text-2); background: var(--surface); }
.btn-ghost:hover { border-color: var(--border-2); color: var(--text); }
.btn-ghost:active { background: var(--surface-2); }
.btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.btn-full { width: 100%; }

.tips {
  margin-top: 20px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); overflow: hidden;
}
.tips summary {
  padding: 12px 16px; cursor: pointer; list-style: none;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12.5px; font-weight: 500; color: var(--text-2); transition: color 0.14s;
}
.tips summary::-webkit-details-marker { display: none; }
.tips summary:hover { color: var(--text); }
.tips[open] summary { border-bottom: 1px solid var(--border); }
.tips summary svg { transition: transform 0.2s; color: var(--text-4); }
.tips[open] summary svg { transform: rotate(180deg); }
.tips-body { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
.tip {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 6px;
  text-align: left; width: 100%; transition: background 0.14s;
}
.tip:hover { background: var(--surface-2); }
.tip-text { flex: 1; font-size: 12.5px; color: var(--text-2); min-width: 0; }
.tip-apply {
  font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 500;
  color: var(--text-4); letter-spacing: 0.04em; text-transform: uppercase;
  flex-shrink: 0; padding: 3px 8px;
  border: 1px solid var(--border); border-radius: 4px; transition: all 0.14s;
}
.tip:hover .tip-apply { color: var(--text); border-color: var(--border-2); }

.vault { margin-top: 40px; }
.vault-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.vault-title {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500;
  color: var(--text-4); letter-spacing: 0.08em; text-transform: uppercase;
}
.tabs {
  display: flex; gap: 4px; padding: 3px;
  background: var(--surface-2); border-radius: 7px; margin-bottom: 14px;
}
.tab {
  flex: 1; padding: 7px 10px; border-radius: 5px;
  font-size: 12px; font-weight: 500; color: var(--text-3);
  display: flex; align-items: center; justify-content: center;
  gap: 6px; transition: all 0.14s; min-width: 0;
}
.tab:hover { color: var(--text-2); }
.tab.active {
  background: var(--surface); color: var(--text);
  box-shadow: 0 1px 2px rgba(0,0,0,0.15);
}
.tab-n {
  font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 500;
  color: var(--text-4); transition: color 0.14s;
}
.tab.active .tab-n { color: var(--text-2); }

.panel { display: none; }
.panel.active { display: block; animation: fade 0.2s ease; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.list-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 4px; padding: 4px 0;
}
.add-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px; border: 1px dashed var(--border-2); border-radius: 6px;
  font-size: 12px; font-weight: 500; color: var(--text-3); transition: all 0.14s;
}
.add-btn:hover { border-color: var(--text-3); color: var(--text); border-style: solid; }
.add-btn svg { width: 12px; height: 12px; }

#saved-list, #api-list, #notes-list { display: flex; flex-direction: column; }
.item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
  animation: itemIn 0.22s ease;
}
@keyframes itemIn { from { opacity: 0; } to { opacity: 1; } }
.item.just { animation: itemIn 0.22s ease, flash 1.6s ease; }
@keyframes flash {
  0% { background: color-mix(in srgb, var(--text) 6%, transparent); }
  100% { background: transparent; }
}
.item-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.item-info { flex: 1; min-width: 0; }
.item-name {
  font-size: 13px; font-weight: 500; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;
}
.item-val {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.02em;
}
.item-meta {
  font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text-4);
  white-space: normal; margin-top: 3px; letter-spacing: 0.02em;
}
.item-acts { display: flex; gap: 3px; flex-shrink: 0; }
.act {
  padding: 4px 9px; border: 1px solid var(--border); border-radius: 4px;
  font-size: 11px; font-weight: 500; color: var(--text-3);
  transition: all 0.14s; font-family: 'Inter', sans-serif;
  height: 26px; display: inline-flex; align-items: center; justify-content: center;
}
.act:hover { color: var(--text); border-color: var(--border-2); }
.act.del:hover { color: var(--weak); border-color: var(--weak); }
.act.load:hover { color: var(--text); }
.act.flash { color: var(--strong); border-color: var(--strong); }
.act svg { width: 12px; height: 12px; }
.empty { padding: 32px 0; text-align: center; color: var(--text-4); font-size: 12.5px; }

/* Note reveal/hide */
.note-content {
  white-space: pre-wrap; word-break: break-word;
  color: var(--text-2); font-family: 'Inter', sans-serif;
  font-size: 12px; line-height: 1.55;
  transition: filter 0.18s, color 0.18s;
}
.note-content.masked {
  color: var(--text-4);
  letter-spacing: 0.08em;
  font-family: 'JetBrains Mono', monospace;
  user-select: none;
}

.chip {
  display: inline-block; font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 500; padding: 2px 7px;
  border-radius: 100px; margin-top: 5px;
  letter-spacing: 0.02em; text-transform: uppercase;
}
.chip.ok { background: color-mix(in srgb, var(--strong) 12%, transparent); color: var(--strong); }
.chip.soon { background: color-mix(in srgb, var(--fair) 14%, transparent); color: var(--fair); }
.chip.exp { background: color-mix(in srgb, var(--weak) 12%, transparent); color: var(--weak); }

.vault-foot {
  margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);
  display: flex; gap: 8px;
}
.vault-foot .btn { flex: 1; height: 38px; font-size: 12.5px; }

.modal {
  display: none; position: fixed; inset: 0;
  background: var(--overlay); z-index: 800;
  align-items: center; justify-content: center; padding: 20px;
  animation: overlayIn 0.16s ease;
}
.modal.open { display: flex; }
#vault-overlay, #import-pass-overlay { z-index: 950; }
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
.dialog {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  width: 100%; max-width: 400px; max-height: 88vh; overflow-y: auto;
  box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  animation: dialogIn 0.2s cubic-bezier(0.16,1,0.3,1);
}
@keyframes dialogIn {
  from { opacity: 0; transform: translateY(6px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.dialog-head {
  padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.dialog-title { font-size: 14px; font-weight: 600; color: var(--text); }
.dialog-x {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 4px; color: var(--text-3); transition: all 0.14s;
}
.dialog-x:hover { color: var(--text); background: var(--surface-2); }
.dialog-x svg { width: 14px; height: 14px; }
.dialog-body { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.field {
  width: 100%; height: 40px; padding: 0 12px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
  font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text);
  transition: border-color 0.14s, background 0.14s;
}
.field::placeholder { color: var(--text-4); }
.field:focus { border-color: var(--text-3); background: var(--surface); }
.field.mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.02em; }
textarea.field {
  height: auto; padding: 10px 12px; min-height: 72px;
  resize: vertical; line-height: 1.5; font-family: 'Inter', sans-serif;
}
textarea.field.mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; }
.field-label {
  font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
  color: var(--text-4); letter-spacing: 0.04em; text-transform: uppercase;
  margin: 2px 0 -4px 2px;
}
.err {
  font-size: 12px; color: var(--weak);
  background: color-mix(in srgb, var(--weak) 10%, transparent);
  padding: 7px 10px; border-radius: 5px; display: none; line-height: 1.4;
}
.err.show { display: block; }
.dialog-acts { display: flex; gap: 8px; margin-top: 2px; }
.dialog-acts .btn { flex: 1; height: 40px; }
.lock-badge {
  width: 36px; height: 36px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2); margin-bottom: 4px;
}

.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translate(-50%, 16px);
  padding: 9px 14px; background: var(--btn-bg); color: var(--btn-fg);
  border-radius: 6px; font-size: 12.5px; font-weight: 500;
  z-index: 1300; opacity: 0; pointer-events: none;
  transition: transform 0.22s cubic-bezier(0.16,1,0.3,1), opacity 0.18s;
  display: flex; align-items: center; gap: 8px;
  max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--strong); flex-shrink: 0;
}
.toast.warn::before { background: var(--fair); }

@media (max-width: 520px) {
  .shell { padding: 18px 14px 80px; }
  #pw-input { font-size: 15px; }
  .pw-field { height: 50px; }
  .icon-btn { width: 42px; }
  .stat { padding: 12px; }
  .stat-v { font-size: 14px; }
  .actions { grid-template-columns: 1fr; }
  .item { flex-wrap: wrap; }
  .item-acts { margin-left: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="shell">

  <header class="head">
    <div class="logo">pw<span>/</span>checker</div>
    <button class="theme-btn" id="theme-btn" title="থিম" type="button" aria-label="থিম পরিবর্তন">
      <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <div class="pw-field">
    <input type="password" id="pw-input" placeholder="পাসওয়ার্ড লিখুন" autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off">
    <button class="icon-btn" id="toggle-btn" title="দেখুন" type="button" aria-label="পাসওয়ার্ড দেখান বা লুকান">
      <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
    <button class="icon-btn" id="copy-btn" title="কপি" type="button" aria-label="কপি">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
    </button>
  </div>

  <div class="meter-head">
    <span class="meter-strength" id="strength-name">অপেক্ষা করছে</span>
    <span class="meter-time" id="crack-time">—</span>
  </div>
  <div class="meter-bar"><div class="meter-fill" id="meter-fill"></div></div>

  <div class="stats">
    <div class="stat">
      <span class="stat-k">নম্বর</span>
      <span class="stat-v" id="score-val">0</span>
    </div>
    <div class="stat">
      <span class="stat-k">এনট্রপি</span>
      <span class="stat-v" id="entropy-val">0</span>
    </div>
    <div class="stat">
      <span class="stat-k">দৈর্ঘ্য</span>
      <span class="stat-v" id="len-val">0</span>
    </div>
  </div>

  <div class="checks">
    <div class="chk" id="chk-len">৮+</div>
    <div class="chk" id="chk-upper">A-Z</div>
    <div class="chk" id="chk-lower">a-z</div>
    <div class="chk" id="chk-num">0-9</div>
    <div class="chk" id="chk-sym">!@#</div>
    <div class="chk" id="chk-long">১৬+</div>
  </div>

  <div class="actions">
    <button class="btn btn-ghost" id="gen-strong" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/><path d="M15.5 7.5L18 5l3 3-2.5 2.5"/></svg>
      পাসওয়ার্ড
    </button>
    <button class="btn btn-ghost" id="gen-pass" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      পাসফ্রেজ

'use strict';

// ═══ Safe storage ═══
function lsGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
function lsRemove(k) { try { localStorage.removeItem(k); } catch (_) {} }
function ssGet(k) { try { return sessionStorage.getItem(k); } catch (_) { return null; } }
function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (_) {} }

// ═══ COPY (robust, works on http/file too) ═══
async function copyText(text) {
  if (!text) return false;
  // Try modern clipboard first
  try {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (_) { /* fall through */ }
  // Fallback: hidden textarea + execCommand
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    const sel = document.getSelection();
    const prevRange = sel && sel.rangeCount > 0 ? sel.getRangeAt(0) : null;
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, text.length); } catch (_) {}
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (prevRange && sel) { sel.removeAllRanges(); sel.addRange(prevRange); }
    return ok;
  } catch (_) { return false; }
}

// ═══ BASE64 UTF-8 ═══
function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToUtf8(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// ═══ TOAST ═══

}

// ═══ CALC ═══
function calcEntropy(pw) {
  let pool = 0;
  if (/[a-z]/.test(pw)) pool += 26;
  if (/[A-Z]/.test(pw)) pool += 26;
  if (/[0-9]/.test(pw)) pool += 10;
  if (/[^a-zA-Z0-9]/.test(pw)) pool += 32;
  return pool > 0 ? Math.floor(pw.length * Math.log2(pool)) : 0;
}
function crackEstimate(e) {
  const s = Math.pow(2, e) / 1e10;
  if (s < 1) return 'সঙ্গে সঙ্গে';
  if (s < 60) return Math.ceil(s) + ' সেকেন্ড';
  if (s < 3600) return Math.ceil(s / 60) + ' মিনিট';
  if (s < 86400) return Math.ceil(s / 3600) + ' ঘণ্টা';
  if (s < 2592000) return Math.ceil(s / 86400) + ' দিন';
  if (s < 31536000) return Math.ceil(s / 2592000) + ' মাস';
  const y = s / 31536000;
  if (y < 1e3) return Math.ceil(y) + ' বছর';
  if (y < 1e6) return (y / 1e3).toFixed(1) + 'K বছর';
  if (y < 1e9) return (y / 1e6).toFixed(1) + 'M বছর';
  return 'শত কোটি+';
}

const tiers = [
  { l:'দুর্বল', c:'c-weak', color:'var(--weak)' },
  { l:'দুর্বল', c:'c-weak', color:'var(--weak)' },
  { l:'মাঝারি', c:'c-fair', color:'var(--fair)' },

  { l:'চমৎকার', c:'c-vstrong', color:'var(--vstrong)' },
];

// ═══ SECURE RANDOM ═══
function secureRandomInt(max) {
  if (max <= 0) return 0;
  const maxU32 = 4294967296;
  const range = maxU32 - (maxU32 % max);
  const arr = new Uint32Array(1);
  let v;
  do { crypto.getRandomValues(arr); v = arr[0]; } while (v >= range);
  return v % max;
}
function secureShuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = secureRandomInt(i + 1);
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

// ═══ TIPS ═══
const randChars = 'abcdefghijklmnopqrstuvwxyz0123456789';
function randSuffix(n) {
  let s = '';
  for (let i = 0; i < n; i++) s += randChars[secureRandomInt(randChars.length)];
  return s;
}
const allTips = [
  { t: function (pw) { return /[A-Z]/.test(pw); }, label:'বড় হাতের অক্ষর যোগ করুন', apply: function (pw) { return pw + 'ABCDEF'[secureRandomInt(6)]; } },
  { t: function (pw) { return /[a-z]/.test(pw); }, label:'ছোট হাতের অক্ষর যোগ করুন', apply: function (pw) { return pw + 'abcde'[secureRandomInt(5)]; } },
  { t: function (pw) { return /[0-9]/.test(pw); }, label:'সংখ্যা যোগ করুন', apply: function (pw) { return pw + (secureRandomInt(90) + 10); } },
  { t: function (pw) { return /[^a-zA-Z0-9]/.test(pw); }, label:'বিশেষ চিহ্ন যোগ করুন', apply: function (pw) { return pw + '!@#$%&*'[secureRandomInt(7)]; } },
  { t: function (pw) { return pw.length >= 12; }, label:'দৈর্ঘ্য বাড়ান', apply: function (pw) { return pw + randSuffix(3); } },
  { t: function (pw) { return !/(.).*\1{2}/.test(pw); }, label:'পুনরাবৃত্তি সরান', apply: function (pw) { return pw.replace(/(.)\1+/g, '$1') + randSuffix(2); } },
];
function updateTips(pw) {
  const tips = allTips.filter(function (x) { return !x.t(pw); });
  tipsBody.innerHTML = '';
  if (pw.length === 0) {
    tipsLabel.textContent = 'পরামর্শ';
    const d = document.createElement('div');
    d.style.cssText = 'padding:16px;text-align:center;color:var(--text-4);font-size:12.5px;';
    d.textContent = 'পাসওয়ার্ড দিন';
    tipsBody.appendChild(d);
    return;
  }
  if (tips.length === 0) {
    tipsLabel.textContent = 'পরামর্শ';
    const d = document.createElement('div');
    d.style.cssText = 'padding:16px;text-align:center;color:var(--text-4);font-size:12.5px;';
    d.textContent = 'সব মানদণ্ড পূরণ';
    tipsBody.appendChild(d);
    return;
  }
  tipsLabel.textContent = 'পরামর্শ · ' + tips.length;
  tips.slice(0, 4).forEach(function (tip) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tip';
    const text = document.createElement('span');

    b.appendChild(text);
    b.appendChild(apply);

      input.type = 'text';
      visible = true;

      input.focus();
      evaluate(nw);
    });
    tipsBody.appendChild(b);
  });
}

// ═══ EVALUATE ═══
function evaluate(pw) {
  const has = {
    len: pw.length >= 8,
    upper: /[A-Z]/.test(pw),
    lower: /[a-z]/.test(pw),
    num: /[0-9]/.test(pw),
    sym: /[^a-zA-Z0-9]/.test(pw),
    long: pw.length >= 16,
  };
  Object.keys(has).forEach(function (k) { checks[k].classList.toggle('pass', has[k]); });

  let score = -1;
  if (pw.length > 0) {
    score = 0;
    if (has.len) score++;
    if (has.upper && has.lower) score++;
    if (has.num) score++;
    if (has.sym) score++;
    if (has.long) score++;
    score = Math.min(score, 4);
  }

  const entropy = calcEntropy(pw);
  lenVal.textContent = pw.length;
  entropyVal.textContent = entropy;

  if (pw.length === 0) {
    scoreVal.textContent = '0';
    strengthName.textContent = 'অপেক্ষা করছে';
    strengthName.className = 'meter-strength';

// ═══ GENERATORS ═══
const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';
const words = ['mango','river','light','tiger','moon','storm','ocean','cloud','flame','swift','brave','gold','iron','echo','nova','blaze','frost','dawn','peak','sage','coral','delta','ember','fable','glide','haven','ivory','jolt','karma','lunar','maple','north','onyx','pixel','quartz','ridge','solar','trace','umber','vapor'];

let recentGen = [];
try {
  const stored = ssGet('recent-gen');
  const parsed = stored ? JSON.parse(stored) : [];
  recentGen = Array.isArray(parsed) ? parsed : [];
} catch (_) { recentGen = []; }

function rememberGen(pw) {
  recentGen.push(pw);
  if (recentGen.length > 30) recentGen.shift();
  ssSet('recent-gen', JSON.stringify(recentGen));
}
function genStrong() {
  const U = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', L = 'abcdefghijklmnopqrstuvwxyz', D = '0123456789';
  const all = U + L + D + symbols;
  let pw, a = 0;
  do {
    const c = [
      U[secureRandomInt(U.length)], L[secureRandomInt(L.length)],
      D[secureRandomInt(D.length)], symbols[secureRandomInt(symbols.length)]
    ];
    for (let i = 0; i < 12; i++) c.push(all[secureRandomInt(all.length)]);
    pw = secureShuffle(c).join('');
    a++;
  } while (recentGen.indexOf(pw) !== -1 && a < 5);
  rememberGen(pw);
  return pw;
}
function genPass() {
  function p(a) { return a[secureRandomInt(a.length)]; }
  let pw, a = 0;
  do {
    const w1 = p(words);
    const w2 = p(words.filter(function (x) { return x !== w1; }));
    const w3 = p(words.filter(function (x) { return x !== w1 && x !== w2; }));
    pw = w1.charAt(0).toUpperCase() + w1.slice(1) + '-' + w2 + p(symbols.split('')) + (secureRandomInt(900) + 100) + w3.charAt(0).toUpperCase() + w3.slice(1);
    a++;
  } while (recentGen.indexOf(pw) !== -1 && a < 5);
  rememberGen(pw);
  return pw;
}
function setPassword(pw) {
  input.value = pw;
  input.type = 'text';
  visible = true;
  eyeIcon.innerHTML = EYE_CLOSED;
  evaluate(pw);
}

// ═══ VAULT CRYPTO ═══
const K_SALT = 'bcoding-vault-salt';
const K_VER = 'bcoding-vault-verifier';
const K_BLOB = 'bcoding-vault-blob';
let vaultKey = null;
let vaultData = { passwords: [], apis: [], notes: [] };
let vaultReady = false;
let pendingAction = null;
let vaultMode = 'create';

function bytesToB64(b) { let s = ''; b.forEach(function (x) { s += String.fromCharCode(x); }); return btoa(s); }
function b64ToBytes(b64) {
  const bin = atob(b64);
  const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}
async function deriveKey(pass, salt) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salt, iterations: 150000, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}
async function encryptK(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(JSON.stringify(obj)));
  return bytesToB64(iv) + '.' + bytesToB64(new Uint8Array(ct));
}
async function decryptK(key, blob) {
  const parts = blob.split('.');
  if (parts.length !== 2) throw new Error('bad blob');
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(parts[0]) }, key, b64ToBytes(parts[1]));
  return JSON.parse(new TextDecoder().decode(pt));
}
function hasVault() { return lsGet(K_SALT) !== null; }

function openVaultModal(mode) {
  vaultMode = mode;
  const title = document.getElementById('vault-title');
  const confirm = document.getElementById('vault-pass-confirm');
  const submit = document.getElementById('vault-submit');
  const reset = document.getElementById('vault-reset');
  document.getElementById('vault-error').classList.remove('show');
  document.getElementById('vault-pass-input').value = '';
  confirm.value = '';
  if (mode === 'create') {
    title.textContent = 'মাস্টার পাসওয়ার্ড তৈরি করুন';
    confirm.style.display = 'block';
    submit.textContent = 'তৈরি করুন';
    reset.style.display = 'none';
  } else {
    title.textContent = 'আনলক করুন';
    confirm.style.display = 'none';
    submit.textContent = 'আনলক';
    reset.style.display = 'block';
  }
  document.getElementById('vault-overlay').classList.add('open');
  setTimeout(function () { document.getElementById('vault-pass-input').focus(); }, 60);
}
function closeVaultModal() { document.getElementById('vault-overlay').classList.remove('open'); }

function ensureVault(action) {
  if (vaultReady) { action(); return; }
  pendingAction = action;
  openVaultModal(hasVault() ? 'unlock' : 'create');
}
async function persistVault() {
  if (!vaultKey) return;
  try { lsSet(K_BLOB, await encryptK(vaultKey, vaultData)); }
  catch (e) { console.error('persist failed', e); }
}
async function createVault(pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(pass, salt);
  lsSet(K_SALT, bytesToB64(salt));
  lsSet(K_VER, await encryptK(key, { ok: 1 }));
  vaultKey = key;
  vaultData = { passwords: [], apis: [], notes: [] };
  await persistVault();
  vaultReady = true;
}
async function unlockVault(pass) {
  const saltB64 = lsGet(K_SALT);
  if (!saltB64) throw new Error('no salt');
  const salt = b64ToBytes(saltB64);
  const key = await deriveKey(pass, salt);
  const ver = lsGet(K_VER);
  if (!ver) throw new Error('no verifier');
  await decryptK(key, ver);
  const blob = lsGet(K_BLOB);
  const data = blob ? await decryptK(key, blob) : { passwords: [], apis: [], notes: [] };
  vaultKey = key;
  vaultData = {
    passwords: Array.isArray(data.passwords) ? data.passwords : [],
    apis: Array.isArray(data.apis) ? data.apis : [],
    notes: Array.isArray(data.notes) ? data.notes : []
  };
  vaultReady = true;
}

// ═══ HELPERS ═══
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function maskKey(k) {
  if (typeof k !== 'string') k = String(k || '');
  return k.length > 8 ? k.slice(0,4) + '••••' + k.slice(-4) : '••••••••';
}
function dotColor(pw) {
  let s = 0;
  if (pw.length >= 8) s++;
  if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) s++;
  if (/[0-9]/.test(pw)) s++;
  if (/[^a-zA-Z0-9]/.test(pw)) s++;
  if (pw.length >= 16) s++;
  return tiers[Math.min(s, 4)].color;
}
function maskContent(content) {
  const len = Math.max(1, Math.min(String(content || '').length, 40));
  return '•'.repeat(len);
}

function apiChip(exp) {
  if (!exp) return '';
  const t = new Date(); t.setHours(0,0,0,0);
  const e = new Date(exp + 'T00:00:00');
  if (isNaN(e.getTime())) return '';
  const d = Math.round((e - t) / 86400000);
  if (d < 0) return '<span class="chip exp">মেয়াদোত্তীর্ণ</span>';
  if (d <= 14) return '<span class="chip soon">' + d + ' দিন</span>';
  return '<span class="chip ok">' + esc(exp) + '</span>';
}
function lastUsed(item) {
  if (!item.lastUsed) return 'ব্যবহার হয়নি';
  const d = Math.floor((Date.now() - item.lastUsed) / 86400000);
  if (d <= 0) return 'আজ';
  if (d === 1) return '১ দিন আগে';
  return d + ' দিন আগে';
}

  const t = document.getElementById('note-title').value.trim();
  const c = document.getElementById('note-content').value.trim();
  if (!t || !c) { showToast('শিরোনাম ও নোট দিন', 'warn'); return; }
  ensureVault(async function () {
    vaultData.notes.unshift({ title: t, content: c, time: Date.now() });
    await persistVault();
    renderNotes(true);
    document.getElementById('note-title').value = '';
    document.getElementById('note-content').value = '';
    showToast('সেভ হয়েছে');
    document.getElementById('add-note-modal').classList.remove('open');
  });
});

function renderAll() { renderPw(); renderApi(); renderNotes(); }

// ═══ BACKUP ═══
document.getElementById('export-btn').addEventListener('click', function () {
  ensureVault(async function () {
    await persistVault();
    const payload = JSON.stringify({
      v: 1,
      salt: lsGet(K_SALT),
      verifier: lsGet(K_VER),
      blob: lsGet(K_BLOB)
    });
    document.getElementById('export-output').value = utf8ToB64(payload);
    showToast('তৈরি হয়েছে');
  });
});
document.getElementById('export-copy').addEventListener('click', async function () {
  const out = document.getElementById('export-output');
  if (!out.value) { showToast('আগে তৈরি করুন', 'warn'); return; }
  const ok = await copyText(out.value);
  if (ok) showToast('কপি হয়েছে');
  else showToast('কপি ব্যর্থ', 'warn');
});

let pendingImport = null;
document.getElementById('import-btn').addEventListener('click', function () {
  const raw = document.getElementById('import-input').value.trim();
  const msg = document.getElementById('backup-msg');
  msg.classList.remove('show');
  if (!raw) return;
  try {
    const payload = JSON.parse(b64ToUtf8(raw));
    if (!payload.salt || !payload.verifier || !payload.blob) throw new Error('invalid');
    pendingImport = payload;
    document.getElementById('import-pass-input').value = '';
    document.getElementById('import-pass-error').classList.remove('show');
    document.getElementById('import-pass-overlay').classList.add('open');
    setTimeout(function () { document.getElementById('import-pass-input').focus(); }, 60);
  } catch (_) {
    msg.textContent = 'ভুল ফরম্যাট';
    msg.classList.add('show');
    showToast('ভুল ফরম্যাট', 'warn');
  }
});
document.getElementById('import-pass-cancel').addEventListener('click', function () {
  pendingImport = null;
  document.getElementById('import-pass-overlay').classList.remove('open');
});
document.getElementById('import-pass-submit').addEventListener('click', async function () {
  const err = document.getElementById('import-pass-error');
  err.classList.remove('show');
  const pass = document.getElementById('import-pass-input').value;
  if (!pendingImport || !pass) return;
  try {
    const salt = b64ToBytes(pendingImport.salt);
    const key = await deriveKey(pass, salt);
    await decryptK(key, pendingImport.verifier);
    const data = await decryptK(key, pendingImport.blob);
    lsSet(K_SALT, pendingImport.salt);
    lsSet(K_VER, pendingImport.verifier);
    lsSet(K_BLOB, pendingImport.blob);
    vaultKey = key;
    vaultData = {
      passwords: Array.isArray(data.passwords) ? data.passwords : [],
      apis: Array.isArray(data.apis) ? data.apis : [],
      notes: Array.isArray(data.notes) ? data.notes : []
    };
    vaultReady = true;
    revealedNotes.clear();
    renderAll();
    document.getElementById('import-input').value = '';
    pendingImport = null;
    document.getElementById('import-pass-overlay').classList.remove('open');
    showToast('সফল');
  } catch (_) {
    err.textContent = 'ভুল পাসওয়ার্ড';
    err.classList.add('show');
  }
});

document.getElementById('backup-btn').addEventListener('click', function () { document.getElementById('backup-modal').classList.add('open'); });
document.getElementById('import-open-btn').addEventListener('click', function () { document.getElementById('backup-modal').classList.add('open'); });

// ═══ MODAL OPEN / CLOSE ═══
function openModal(id) { document.getElementById(id).classList.add('open'); }
document.getElementById('add-pw-btn').addEventListener('click', function () { openModal('add-pw-modal'); });
document.getElementById('add-api-btn').addEventListener('click', function () { openModal('add-api-modal'); });
document.getElementById('add-note-btn').addEventListener('click', function () { openModal('add-note-modal'); });

document.querySelectorAll('.dialog-x').forEach(function (btn) {
  btn.addEventListener('click', function () { document.getElementById(btn.dataset.close).classList.remove('open'); });
});

document.querySelectorAll('.modal').forEach(function (m) {
  m.addEventListener('click', function (e) {
    if (e.target !== m) return;
    if (m.id === 'import-pass-overlay') {
      pendingImport = null;
      m.classList.remove('open');
      return;
    }
    if (m.id === 'vault-overlay') {
      pendingAction = null;
    }
    m.classList.remove('open');
  });
});

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  const importOverlay = document.getElementById('import-pass-overlay');
  const vaultOverlay = document.getElementById('vault-overlay');
  if (importOverlay.classList.contains('open')) {
    pendingImport = null;
    importOverlay.classList.remove('open');
    return;
  }
  if (vaultOverlay.classList.contains('open')) {
    pendingAction = null;
    vaultOverlay.classList.remove('open');
    return;
  }
  document.querySelectorAll('.modal.open').forEach(function (m) { m.classList.remove('open'); });
});

// ═══ INIT ═══
renderAll();
evaluate('');
if (hasVault()) openVaultModal('unlock');
</script>
</body>
</html>
